    box.appendChild(el("h3",{style:{margin:"0 0 18px",color:"#1e3a5f",fontSize:"17px"}},"✅ Confirmar Liquidación"));
    [[`💵 Efectivo`,fQ(totalEfectivoM)],[`🏦 Depósito`,fQ(totalDepositoM)],[`📲 Transferencia`,fQ(totalTransferenciaM)],[`Total recibido`,fQ(totalPagosM),true],[`⛽ Gastos (de cuenta)`,`-${fQ(totalGastosDeCuentaM)}`],[`📦 Total a cobrar`,fQ(totalNetoM)],[`↩️ Diferencia`,difTexto,false,difColor]].forEach(([l,v,bold,col])=>{
      const r=el("div",{style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f0f4f8"}});
      r.appendChild(el("span",{style:{fontSize:"13px",color:"#666"}},l));
      r.appendChild(el("span",{style:{fontSize:"13px",fontWeight:bold?"700":"600",color:col||"#333"}},v));
      box.appendChild(r);
    });
    const btns=el("div",{style:{display:"flex",gap:"10px",marginTop:"18px"}});
    btns.appendChild(el("button",{style:{flex:"1",background:"#27ae60",color:"#fff",border:"none",borderRadius:"8px",padding:"11px 0",fontSize:"14px",fontWeight:"700",cursor:"pointer"},onClick:confirmarLiquidacion},state.guardando?"Guardando...":"✅ Confirmar"));
    btns.appendChild(el("button",{style:{flex:"1",background:"#eee",color:"#555",border:"none",borderRadius:"8px",padding:"11px 0",fontSize:"14px",cursor:"pointer"},onClick:()=>setState({showConfirmar:false})},"Cancelar"));
    box.appendChild(btns); modal.appendChild(box); wrap.appendChild(modal);
  }

  return wrap;
}

// ── Resumen de Devoluciones ──
function renderResumenDevoluciones() {
  const devs = state.devoluciones || [];
  const cMap = state.clienteMap || {};

  // Helper: obtener ruta de un cliente
  const getRutaCliente = c => cMap[c]?.ruta || "Sin ruta";

  // Recopilar todas las rutas que tienen devoluciones
  const rutasConDevs = new Set();
  devs.forEach(d => rutasConDevs.add(getRutaCliente(d.cliente)));
  const devsTotalesAll = Object.keys(cMap).filter(c => state.estadoEntrega[c] === "rosado");
  devsTotalesAll.forEach(c => rutasConDevs.add(getRutaCliente(c)));
  const todasRutas = Array.from(rutasConDevs).sort();

  // Filtro activo de ruta
  const filtroRuta = state.dvResumenFiltroRuta || "";

  // Aplicar filtro
  const devsFiltr = filtroRuta ? devs.filter(d => getRutaCliente(d.cliente) === filtroRuta) : devs;
  const devsTotales = devsTotalesAll.filter(c => !filtroRuta || getRutaCliente(c) === filtroRuta);

  // Agrupar devs parciales por ruta → cliente
  const porRuta = {};
  devsFiltr.forEach(d => {
    const ruta = getRutaCliente(d.cliente);
    if (!porRuta[ruta]) porRuta[ruta] = {};
    if (!porRuta[ruta][d.cliente]) porRuta[ruta][d.cliente] = { devs: [], total: 0 };
    porRuta[ruta][d.cliente].devs.push(d);
    porRuta[ruta][d.cliente].total += d.monto;
  });

  // Agrupar devs totales (rosados) por ruta
  const totalPorRuta = {};
  devsTotales.forEach(c => {
    const ruta = getRutaCliente(c);
    if (!totalPorRuta[ruta]) totalPorRuta[ruta] = [];
    totalPorRuta[ruta].push(c);
  });

  // Agrupar por producto (todas las devs filtradas)
  const porProducto = {};
  devsFiltr.forEach(d => {
    const k = d.producto;
    if (!porProducto[k]) porProducto[k] = { unidades: 0, monto: 0, clientes: new Set() };
    porProducto[k].unidades += d.unidades;
    porProducto[k].monto += d.monto;
    porProducto[k].clientes.add(d.cliente);
  });

  const totalDevM = devsFiltr.reduce((s, d) => s + d.monto, 0);
  const totalDevU = devsFiltr.reduce((s, d) => s + d.unidades, 0);
  const totalDevTotalesM = devsTotales.reduce((s, c) => s + totalesCliente(c).monto, 0);
  const totalGeneral = totalDevM + totalDevTotalesM;

  const wrap = el("div", { style: { fontFamily: "sans-serif", background: "#f4f6f9", minHeight: "100vh", padding: "24px" } });
  const inner = el("div", { style: { maxWidth: "700px", margin: "0 auto" } });
  wrap.appendChild(inner);

  // Header
  const hdr = el("div", { style: { background: "#c0392b", color: "#fff", borderRadius: "12px", padding: "14px 20px", marginBottom: "16px", display: "flex", alignItems: "center", gap: "12px" } });
  hdr.appendChild(el("button", { style: { background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: "8px", padding: "7px 14px", cursor: "pointer", fontSize: "13px", flexShrink: "0" }, onClick: () => setState({ screen: state.modoHistorial ? "historialVista" : "main" }) }, "← Volver"));
  const hdrInfo = el("div", { style: { flex: "1" } });
  hdrInfo.appendChild(el("h2", { style: { margin: "0", fontSize: "17px", fontWeight: "700" } }, "↩️ Resumen de Devoluciones"));
  hdrInfo.appendChild(el("p", { style: { margin: "2px 0 0", fontSize: "11px", opacity: "0.7" } }, `${state.fecha} · Total: ${fQ(totalGeneral)}`));
  hdr.appendChild(hdrInfo);
  inner.appendChild(hdr);

  // ── Chips de filtro por ruta ──
  if (todasRutas.length > 1) {
    const chipsWrap = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "16px" } });
    const chipTodas = el("button", {
      style: { padding: "6px 14px", borderRadius: "20px", border: "none", cursor: "pointer", fontSize: "12px", fontWeight: "700",
        background: !filtroRuta ? "#c0392b" : "#e0e0e0", color: !filtroRuta ? "#fff" : "#555" },
      onClick: () => { state.dvResumenFiltroRuta = ""; render(); }
    }, "Todas");
    chipsWrap.appendChild(chipTodas);
    todasRutas.forEach(ruta => {
      const activo = filtroRuta === ruta;
      const chip = el("button", {
        style: { padding: "6px 14px", borderRadius: "20px", border: "none", cursor: "pointer", fontSize: "12px", fontWeight: "700",
          background: activo ? "#c0392b" : "#fff", color: activo ? "#fff" : "#c0392b",
          boxShadow: "0 1px 4px rgba(0,0,0,0.12)" },
        onClick: () => { state.dvResumenFiltroRuta = activo ? "" : ruta; render(); }
      }, ruta);
      chipsWrap.appendChild(chip);
    });
    inner.appendChild(chipsWrap);
  }

  if (devsFiltr.length === 0 && devsTotales.length === 0) {
    inner.appendChild(el("div", { style: { background: "#fff", borderRadius: "12px", padding: "40px", textAlign: "center", color: "#aaa", fontSize: "14px" } }, "No hay devoluciones registradas."));
    return wrap;
  }

  const secCard = (titulo, bg, children) => {
    const d = el("div", { style: { background: "#fff", borderRadius: "12px", padding: "18px 20px", marginBottom: "14px", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" } });
    d.appendChild(el("div", { style: { fontWeight: "700", color: bg || "#c0392b", fontSize: "13px", marginBottom: "12px", textTransform: "uppercase", letterSpacing: "0.5px" } }, titulo));
    children.forEach(c => d.appendChild(c));
    return d;
  };

  // ── Devoluciones totales (rosados) agrupadas por ruta ──
  const rutasTotales = Array.from(new Set(devsTotales.map(c => getRutaCliente(c)))).sort();
  if (devsTotales.length > 0) {
    const rows = [];
    rutasTotales.forEach(ruta => {
      const clientesDeRuta = (totalPorRuta[ruta] || []);
      // Título de ruta
      rows.push(el("div", { style: { fontWeight: "700", fontSize: "12px", color: "#9b59b6", background: "#f5eef8", borderRadius: "6px", padding: "4px 10px", margin: "6px 0 4px" } }, `📍 ${ruta}`));
      clientesDeRuta.forEach(c => {
        const tt = totalesCliente(c);
        const mot = state.motivosDevTotal[c];
        const r = el("div", { style: { padding: "6px 0 6px 8px", borderBottom: "1px solid #f0f4f8" } });
        r.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#e91e8c" } }, c),
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#c0392b" } }, fQ(tt.monto))
        ));
        if (mot) r.appendChild(el("div", { style: { fontSize: "11px", color: "#888", marginTop: "2px" } }, `${mot.codigo} — ${mot.desc}`));
        rows.push(r);
      });
    });
    const totRow = el("div", { style: { display: "flex", justifyContent: "space-between", marginTop: "8px", fontWeight: "700", fontSize: "13px", color: "#c0392b" } });
    totRow.appendChild(el("span", {}, "Total devoluciones totales"));
    totRow.appendChild(el("span", {}, fQ(totalDevTotalesM)));
    rows.push(totRow);
    inner.appendChild(secCard(`🔴 Devoluciones Totales (${devsTotales.length} cliente${devsTotales.length > 1 ? "s" : ""})`, "#e91e8c", rows));
  }

  // ── Por ruta → cliente (parciales) ──
  const rutasParciales = Object.keys(porRuta).sort();
  if (rutasParciales.length > 0) {
    const rows = [];
    rutasParciales.forEach(ruta => {
      // Título de ruta
      rows.push(el("div", { style: { fontWeight: "700", fontSize: "12px", color: "#9b59b6", background: "#f5eef8", borderRadius: "6px", padding: "4px 10px", margin: "6px 0 4px" } }, `📍 ${ruta}`));
      Object.entries(porRuta[ruta]).sort((a, b) => b[1].total - a[1].total).forEach(([cliente, data]) => {
        const hRow = el("div", { style: { padding: "6px 0 4px 8px", borderBottom: "1px solid #f0f4f8" } });
        hRow.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "4px" } },
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#1e3a5f" } }, cliente),
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#c0392b" } }, `-${fQ(data.total)}`)
        ));
        data.devs.forEach(d => {
          const dr = el("div", { style: { padding: "2px 0 2px 12px", fontSize: "12px", color: "#666" } });
          // Fila producto
          const prodRow = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "8px" } });
          prodRow.appendChild(el("span", { style: { flex: "1", wordBreak: "break-word" } }, d.producto));
          const vals = el("div", { style: { display: "flex", gap: "10px", flexShrink: "0" } });
          vals.appendChild(el("span", { style: { color: "#555" } }, `${fN(d.unidades)} u`));
          vals.appendChild(el("span", { style: { color: "#c0392b", fontWeight: "600" } }, `-${fQ(d.monto)}`));
          prodRow.appendChild(vals);
          dr.appendChild(prodRow);
          // Fila meta: pedido + motivo
          const meta = [];
          if (d.pedido && d.pedido !== "S/N") meta.push(`📋 ${d.pedido}`);
          if (d.codigo) {
            const mot = MOTIVOS.find(m => m.codigo === d.codigo);
            if (mot) meta.push(`${mot.codigo} — ${mot.desc}`);
            else meta.push(d.codigo);
          }
          if (meta.length > 0) {
            dr.appendChild(el("div", { style: { fontSize: "11px", color: "#999", marginTop: "1px" } }, meta.join(" · ")));
          }
          rows.push(dr);
        });
        rows.push(hRow);
        // reorder: hRow first, then detail rows — fix by building array properly
      });
    });

    // Rebuild rows correctly (hRow before detail rows)
    const rowsFixed = [];
    rutasParciales.forEach(ruta => {
      rowsFixed.push(el("div", { style: { fontWeight: "700", fontSize: "12px", color: "#9b59b6", background: "#f5eef8", borderRadius: "6px", padding: "4px 10px", margin: "6px 0 4px" } }, `📍 ${ruta}`));
      Object.entries(porRuta[ruta]).sort((a, b) => b[1].total - a[1].total).forEach(([cliente, data]) => {
        const hRow = el("div", { style: { padding: "6px 0 4px 8px", borderBottom: "1px solid #f0f4f8" } });
        hRow.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "2px" } },
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#1e3a5f" } }, cliente),
          el("span", { style: { fontWeight: "700", fontSize: "13px", color: "#c0392b" } }, `-${fQ(data.total)}`)
        ));
        rowsFixed.push(hRow);
        data.devs.forEach(d => {
          const dr = el("div", { style: { padding: "3px 0 3px 14px", fontSize: "12px", color: "#666" } });
          const prodRow = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "8px" } });
          prodRow.appendChild(el("span", { style: { flex: "1", wordBreak: "break-word" } }, d.producto));
          const vals = el("div", { style: { display: "flex", gap: "10px", flexShrink: "0" } });
          vals.appendChild(el("span", { style: { color: "#555" } }, `${fN(d.unidades)} u`));
          vals.appendChild(el("span", { style: { color: "#c0392b", fontWeight: "600" } }, `-${fQ(d.monto)}`));
          prodRow.appendChild(vals);
          dr.appendChild(prodRow);
          const meta = [];
          if (d.pedido && d.pedido !== "S/N") meta.push(`📋 ${d.pedido}`);
          if (d.codigo) {
            const mot = MOTIVOS.find(m => m.codigo === d.codigo);
            if (mot) meta.push(`${mot.codigo} — ${mot.desc}`);
            else meta.push(d.codigo);
          }
          if (meta.length > 0) {
            dr.appendChild(el("div", { style: { fontSize: "11px", color: "#999", marginTop: "1px" } }, meta.join(" · ")));
          }
          rowsFixed.push(dr);
        });
      });
    });
    const totRow = el("div", { style: { display: "flex", justifyContent: "space-between", marginTop: "8px", padding: "8px 0 0", fontWeight: "700", fontSize: "13px", color: "#c0392b", borderTop: "2px solid #f0f4f8" } });
    totRow.appendChild(el("span", {}, `Total parciales (${fN(totalDevU)} u)`));
    totRow.appendChild(el("span", {}, `-${fQ(totalDevM)}`));
    rowsFixed.push(totRow);
    inner.appendChild(secCard(`↩️ Por Ruta / Cliente (${Object.values(porRuta).reduce((s, r) => s + Object.keys(r).length, 0)})`, "#c0392b", rowsFixed));
  }

  // ── Por producto ──
  if (Object.keys(porProducto).length > 0) {
    const rows = Object.entries(porProducto).sort((a, b) => b[1].monto - a[1].monto).map(([prod, data]) => {
      const r = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #f0f4f8", gap: "8px" } });
      const izq = el("div", { style: { flex: "1" } });
      izq.appendChild(el("div", { style: { fontSize: "13px", color: "#333", wordBreak: "break-word" } }, prod));
      izq.appendChild(el("div", { style: { fontSize: "11px", color: "#888", marginTop: "1px" } }, `${data.clientes.size} cliente${data.clientes.size > 1 ? "s" : ""} · ${fN(data.unidades)} u`));
      r.appendChild(izq);
      r.appendChild(el("span", { style: { fontWeight: "700", color: "#c0392b", flexShrink: "0" } }, `-${fQ(data.monto)}`));
      return r;
    });
    inner.appendChild(secCard(`📦 Por Producto (${Object.keys(porProducto).length})`, "#c0392b", rows));
  }

  return wrap;
}

// ── Render principal ──
function render() {
  const app=document.getElementById("app");
  app.innerHTML="";
  let content;
  if(!state.autenticado) content=renderLogin();
  else if(state.cargandoDatos) content=renderCargando();
  else if(state.screenAdmin==="usuarios") content=renderAdminUsuarios();
  else if(state.screen==="menu") content=renderMenu();
  else if(state.screen==="menuRepartidor") content=renderMenuRepartidor();
  else if(state.screen==="seleccionEntrega") content=renderSeleccionEntrega();
  else if(state.screen==="inicio") content=renderInicio();
  else if(state.screen==="nodatos") content=renderNoDatos();
  else if(state.screen==="upload") content=renderUpload();
  else if(state.screen==="resumenEntregas") content=renderResumenEntregas();
  else if(state.screen==="resumenLiq") content=renderResumenLiquidacion();
  else if(state.screen==="resumenDevs") content=renderResumenDevoluciones();
  else if(state.screen==="historial") content=renderHistorial();
  else if(state.screen==="historialVista" && state.clienteDetalle) content=renderDetalleCliente();
  else if(state.screen==="confirmado") content=renderConfirmado();
  else if(state.screen==="opciones") content=renderOpciones();
  else if(state.screen==="historialVista") content=renderMain();
  else if(state.clienteDetalle) content=renderDetalleCliente();
  else content=renderMain();
  app.appendChild(content);
  // Scroll al cliente después de volver del detalle
  if(state.scrollAfterCliente) {
    const target = app.querySelector(`[data-cliente="${CSS.escape(state.scrollAfterCliente)}"]`);
    if(target) {
      setTimeout(()=>{ target.scrollIntoView({behavior:"smooth", block:"center"}); }, 80);
    }
    state.scrollAfterCliente = null;
  }
  // Restaurar foco en el buscador si estaba activo
  if(state._busqFocused) {
    const busqEl = app.querySelector('input[placeholder*="Buscar"]');
    if(busqEl) {
      busqEl.focus();
      const len = busqEl.value.length;
      busqEl.setSelectionRange(len, len);
    }
  }
}

// ── Render Login ──
function renderLogin() {
  // Precargar último usuario usado en este dispositivo
  if(!state.appUser) { try { const lu=localStorage.getItem("liq_lastuser"); if(lu) state.appUser=lu; } catch(e){} }

  // Formatear fecha legible para mostrar
  const fechaDisplay = (() => {
    const [y,m,d] = state.loginFechaEntrega.split("-");
    const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const dt=new Date(Number(y),Number(m)-1,Number(d));
    return `${dias[dt.getDay()]}, ${Number(d)} de ${meses[dt.getMonth()]} de ${y}`;
  })();

  const wrap = el("div",{style:{fontFamily:"sans-serif",background:"#f4f6f9",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}});
  const box = el("div",{style:{background:"#fff",borderRadius:"16px",padding:"32px 28px",width:"100%",maxWidth:"360px",boxShadow:"0 8px 32px rgba(0,0,0,0.12)",textAlign:"center"}});
  box.appendChild(el("div",{style:{fontSize:"48px",marginBottom:"10px"}},"📦"));
  box.appendChild(el("h2",{style:{margin:"0 0 2px",color:"#1e3a5f",fontSize:"20px"}},"Liquidación de Entregas"));

  // Mostrar fecha de entrega
  const fechaBox = el("div",{style:{background:"#e8f0fe",borderRadius:"8px",padding:"8px 14px",marginBottom:"20px",display:"inline-block"}});
  fechaBox.appendChild(el("span",{style:{fontSize:"13px",color:"#1e3a5f",fontWeight:"600"}},"📅 "+fechaDisplay));
  box.appendChild(fechaBox);

  if(state.resetEnviado) {
    box.appendChild(el("div",{style:{background:"#e8f5e9",borderRadius:"10px",padding:"16px",marginBottom:"16px",fontSize:"13px",color:"#27ae60",fontWeight:"600"}},"✅ Correo enviado. Revisa tu bandeja de entrada para restablecer tu contraseña."));
    box.appendChild(el("button",{style:{width:"100%",background:"#1e3a5f",color:"#fff",border:"none",borderRadius:"8px",padding:"11px 0",fontSize:"14px",fontWeight:"700",cursor:"pointer"},onClick:()=>setState({resetEnviado:false})},"Volver al login"));
    wrap.appendChild(box); return wrap;
  }

  // ── Helper label ──
  const lbl = (txt) => { const l=document.createElement("label"); l.textContent=txt; l.style.cssText="display:block;font-size:11px;font-weight:600;color:#666;text-align:left;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.4px;"; return l; };

  // ── Usuario ──
  box.appendChild(lbl("Usuario"));
  const emailInp = document.createElement("input");
  emailInp.type = "text"; emailInp.placeholder = "Nombre de usuario";
  emailInp.value = state.appUser || "";
  emailInp.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;margin-bottom:12px;";
  emailInp.addEventListener("input", e => { state.appUser = e.target.value; });
  emailInp.addEventListener("keydown", e => { if(e.key==="Enter") passInp.focus(); });
  setTimeout(()=>emailInp.focus(), 100);
  box.appendChild(emailInp);

  // ── Contraseña ──
  box.appendChild(lbl("Contraseña"));
  const passWrap = el("div",{style:{position:"relative",marginBottom:"12px"}});
  const passInp = document.createElement("input");
  passInp.type = state.verPass ? "text" : "password";
  passInp.placeholder = "Contraseña";
  passInp.value = state.appPass || "";
  passInp.style.cssText = "width:100%;padding:10px 40px 10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;";
  passInp.addEventListener("input", e => { state.appPass = e.target.value; });
  passInp.addEventListener("keydown", e => { if(e.key==="Enter") { document.activeElement?.blur(); iniciarSesion(); } });
  const eyeBtn = document.createElement("button");
  eyeBtn.type = "button"; eyeBtn.textContent = state.verPass ? "🙈" : "👁️";
  eyeBtn.style.cssText = "position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#888;padding:0;line-height:1;";
  eyeBtn.addEventListener("click", () => { state.verPass=!state.verPass; passInp.type=state.verPass?"text":"password"; eyeBtn.textContent=state.verPass?"🙈":"👁️"; });
  passWrap.appendChild(passInp); passWrap.appendChild(eyeBtn);
  box.appendChild(passWrap);


  // ── Fecha de entrega (solo editable para admin, readonly para repartidor) ──
  const esAdminLocal = (() => { try { const s=localStorage.getItem("liq_session"); if(s){const u=JSON.parse(s);return u.rol==="admin";}} catch(e){} return false; })();
  if(esAdminLocal) {
    box.appendChild(lbl("📅 Fecha de entrega"));
    const fechaInp = document.createElement("input");
    fechaInp.type = "date";
    fechaInp.value = state.loginFechaEntrega || hoy();
    fechaInp.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;margin-bottom:16px;";
    fechaInp.addEventListener("change", e=>{ state.loginFechaEntrega=e.target.value; });
    box.appendChild(fechaInp);
  }

  if(state.appPassError) box.appendChild(el("p",{style:{color:"#c00",fontSize:"12px",margin:"0 0 10px"}},state.appPassError));

  const loginBtn = document.createElement("button");
  loginBtn.textContent = state.cargandoDatos ? "Ingresando..." : "Ingresar";
  loginBtn.disabled = state.cargandoDatos;
  loginBtn.style.cssText = "width:100%;background:#1e3a5f;color:#fff;border:none;border-radius:10px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-bottom:12px;";
  loginBtn.addEventListener("click", ()=>{ document.activeElement?.blur(); iniciarSesion(); });
  box.appendChild(loginBtn);

  const forgotBtn = document.createElement("button");
  forgotBtn.textContent = "¿Olvidaste tu contraseña?";
  forgotBtn.style.cssText = "background:none;border:none;color:#2980b9;font-size:12px;cursor:pointer;font-family:sans-serif;text-decoration:underline;";
  forgotBtn.addEventListener("click", recuperarContrasena);
  box.appendChild(forgotBtn);

  wrap.appendChild(box);
  return wrap;
}


// ── Modal gestionar personal (repartidores y auxiliares) ──
function abrirModalPersonal() {
  const prev = document.getElementById("modal-personal");
  if(prev) prev.remove();

  const overlay = document.createElement("div");
  overlay.id = "modal-personal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;font-family:sans-serif;";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:14px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;";
  // Detener propagación del click dentro del box para que no cierre el overlay
  box.addEventListener("click", e => e.stopPropagation());
  box.addEventListener("mousedown", e => e.stopPropagation());

  // Estado local: cada persona es objeto {nombre, alias}
  const toObj = v => typeof v === "string" ? {nombre:v, alias:""} : {nombre:v.nombre||"", alias:v.alias||""};
  let reps = (state.listaRepartidores||[]).map(toObj);
  let auxs = (state.listaAuxiliares||[]).map(toObj);

  // Vista detalle de una persona (expandido al hacer click en su nombre)
  let expandidoRep = null; // índice expandido en reps
  let expandidoAux = null; // índice expandido en auxs

  const cardPersona = (arr, idx, color, onExpand, expandido) => {
    const persona = arr[idx];
    const card = document.createElement("div");
    card.style.cssText = `background:#f9f9f9;border-radius:10px;border:1px solid #e0e0e0;margin-bottom:8px;overflow:hidden;`;

    // Fila principal (nombre + botón eliminar)
    const fila = document.createElement("div");
    fila.style.cssText = "display:flex;gap:8px;align-items:center;padding:10px 10px 10px 14px;cursor:pointer;";

    chevron.textContent = expandido ? "▲" : "▼";
    chevron.style.cssText = "font-size:11px;color:#aaa;margin-right:6px;";

    btnDel.addEventListener("mousedown", e => e.stopPropagation());
    btnDel.onclick = e => {
      e.stopPropagation();
      showModal({titulo:"🗑️ Eliminar", mensaje:'¿Eliminar a "' + (persona.nombre||"este registro") + '"?', tipo:"confirm", btnAceptar:"Eliminar", colorAceptar:"#c0392b", btnCancelar:"Cancelar",
      onAceptar: () => { arr.splice(idx,1); renderContenido(); } }); return;
    };
    fila.appendChild(btnDel);

    fila.addEventListener("click", e => { e.stopPropagation(); onExpand(expandido ? null : idx); });
    card.appendChild(fila);

    // Panel de detalle (visible solo cuando expandido)
    if(expandido) {
      const panel = document.createElement("div");
      panel.style.cssText = "padding:0 14px 14px;border-top:1px solid #eee;";

      const mkField = (lbl, val, ph, onChange) => {
        const l = document.createElement("label");
        l.textContent = lbl;
        l.style.cssText = "display:block;font-size:11px;font-weight:600;color:#888;margin:10px 0 3px;text-transform:uppercase;";
        const inp = document.createElement("input");
        inp.type = "text"; inp.value = val; inp.placeholder = ph;
        inp.style.cssText = "width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ccc;font-size:13px;box-sizing:border-box;font-family:sans-serif;";
        inp.addEventListener("mousedown", e => e.stopPropagation());
        inp.addEventListener("input", e => { onChange(e.target.value); nombreSpan.textContent = arr[idx].nombre || "(sin nombre)"; });
        panel.appendChild(l); panel.appendChild(inp); return inp;
      };

      mkField("Nombre completo", persona.nombre, "Ej: Juan Pérez", v => { arr[idx].nombre = v; });
      mkField("Alias / Apodo", persona.alias, "Ej: Juancho", v => { arr[idx].alias = v; });
      card.appendChild(panel);
    }
    return card;
  };

  const renderContenido = () => {
    box.innerHTML = "";

    const titulo = document.createElement("h3");
    titulo.textContent = "🚚 Gestionar personal";
    titulo.style.cssText = "margin:0 0 4px;color:#1a6e3c;font-size:16px;";
    box.appendChild(titulo);
    const desc = document.createElement("p");
    desc.textContent = "Haz click en un nombre para ver o editar sus datos.";
    desc.style.cssText = "font-size:12px;color:#888;margin:0 0 18px;";
    box.appendChild(desc);

    // ── Repartidores ──
    const hRep = document.createElement("p");
    hRep.textContent = "🚚 Repartidores";
    hRep.style.cssText = "font-size:13px;font-weight:700;color:#1a6e3c;margin:0 0 8px;";
    box.appendChild(hRep);
    reps.forEach((_, idx) => {
      box.appendChild(cardPersona(reps, idx, "#1a6e3c",
        newIdx => { expandidoRep = newIdx; renderContenido(); },
        expandidoRep === idx
      ));
    });
    const btnAgrRep = document.createElement("button");
    btnAgrRep.textContent = "➕ Agregar repartidor";
    btnAgrRep.style.cssText = "width:100%;background:#e8f5e9;color:#1a6e3c;border:2px dashed #1a6e3c;border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-bottom:20px;";
    btnAgrRep.addEventListener("mousedown", e => e.stopPropagation());
    btnAgrRep.onclick = e => { e.stopPropagation(); reps.push({nombre:"",alias:""}); expandidoRep=reps.length-1; renderContenido(); };
    box.appendChild(btnAgrRep);

    // ── Auxiliares ──
    const hAux = document.createElement("p");
    hAux.textContent = "👷 Auxiliares";
    hAux.style.cssText = "font-size:13px;font-weight:700;color:#1565c0;margin:0 0 8px;";
    box.appendChild(hAux);
    auxs.forEach((_, idx) => {
      box.appendChild(cardPersona(auxs, idx, "#1565c0",
        newIdx => { expandidoAux = newIdx; renderContenido(); },
        expandidoAux === idx
      ));
    });
    const btnAgrAux = document.createElement("button");
    btnAgrAux.textContent = "➕ Agregar auxiliar";
    btnAgrAux.style.cssText = "width:100%;background:#e3f2fd;color:#1565c0;border:2px dashed #1565c0;border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-bottom:16px;";
    btnAgrAux.addEventListener("mousedown", e => e.stopPropagation());
    btnAgrAux.onclick = e => { e.stopPropagation(); auxs.push({nombre:"",alias:""}); expandidoAux=auxs.length-1; renderContenido(); };
    box.appendChild(btnAgrAux);

    const errP = document.createElement("p");
    errP.id = "modal-personal-err";
    errP.style.cssText = "color:#c00;font-size:12px;margin:0 0 10px;min-height:16px;";
    box.appendChild(errP);

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;gap:10px;";

    const btnGuardar = document.createElement("button");
    btnGuardar.textContent = "💾 Guardar";
    btnGuardar.style.cssText = "flex:1;background:#1a6e3c;color:#fff;border:none;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
    btnGuardar.addEventListener("mousedown", e => e.stopPropagation());
    btnGuardar.onclick = async e => {
      e.stopPropagation();
      const repsLimpios = reps.map(r=>({nombre:r.nombre.trim(),alias:r.alias.trim()})).filter(r=>r.nombre);
      const auxsLimpios = auxs.map(a=>({nombre:a.nombre.trim(),alias:a.alias.trim()})).filter(a=>a.nombre);
      btnGuardar.textContent = "Guardando..."; btnGuardar.disabled = true;
      try {
        const cfgActual = await fbGet("config") || {};
        await fbSet("config", {...cfgActual, personal:{repartidores:repsLimpios, auxiliares:auxsLimpios}});
        state.listaRepartidores = repsLimpios;
        state.listaAuxiliares = auxsLimpios;
        overlay.remove();
        showToast("✅ Personal actualizado","#27ae60");
      } catch(e2) {
        const ep = document.getElementById("modal-personal-err");
        if(ep) ep.textContent = "Error al guardar. Intenta de nuevo.";
        btnGuardar.textContent = "💾 Guardar"; btnGuardar.disabled = false;
      }
    };
    btnRow.appendChild(btnGuardar);

    const btnCancelar = document.createElement("button");
    btnCancelar.textContent = "Cancelar";
    btnCancelar.style.cssText = "flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:11px 0;font-size:14px;cursor:pointer;font-family:sans-serif;";
    btnCancelar.addEventListener("mousedown", e => e.stopPropagation());
    btnCancelar.onclick = e => { e.stopPropagation(); overlay.remove(); };
    btnRow.appendChild(btnCancelar);
    box.appendChild(btnRow);
  };

  renderContenido();
  overlay.appendChild(box);
  // Solo cerrar si el click es exactamente en el overlay oscuro, no en el box
  overlay.addEventListener("click", e => { if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// ── Pantalla selección de entrega (repartidor + auxiliar + fecha) ──
function renderSeleccionEntrega() {
  const repVinculado = state.repartidorVinculado;
  const repNombre   = repVinculado?(typeof repVinculado==="string"?repVinculado:(repVinculado.nombre||"")):"";
  const tieneData   = Object.keys(state.clienteMap||{}).length>0;

  const wrap = el("div",{style:{fontFamily:"sans-serif",background:"#f4f6f9",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}});
  const box  = el("div",{style:{background:"#fff",borderRadius:"16px",padding:"32px 28px",maxWidth:"380px",width:"100%",boxShadow:"0 8px 32px rgba(0,0,0,0.12)"}});

  // Header con volver
  const hdr = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"20px"}});
  hdr.appendChild(el("button",{style:{background:"#f0f4f8",border:"none",borderRadius:"8px",padding:"8px 12px",cursor:"pointer",fontSize:"13px",color:"#555"},onClick:()=>setState({screen:"menuRepartidor"})},"← Volver"));
  hdr.appendChild(el("h2",{style:{margin:"0",fontSize:"17px",color:"#1e3a5f"}},"Datos de entrega"));
  box.appendChild(hdr);

  const lbl = (txt,obligatorio=false) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:4px;margin-bottom:3px;";
    const t = document.createElement("span");
    t.textContent = txt;
    t.style.cssText = "font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.4px;";
    row.appendChild(t);
    if(obligatorio) {
      const ast = document.createElement("span");
      ast.className = "ast-campo";
      ast.textContent = "*";
      ast.style.cssText = "font-size:13px;font-weight:700;color:#bbb;";
      row.appendChild(ast);
    }
    return row;
  };

  // ── Repartidor ──
  box.appendChild(lbl("🚚 Repartidor", false));
  if(repNombre) {
    // Fijo: vinculado al usuario
    const repDiv = document.createElement("div");
    repDiv.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e0e0e0;font-size:14px;box-sizing:border-box;background:#f8f8f8;color:#1a6e3c;font-weight:600;margin-bottom:12px;";
    repDiv.textContent = repNombre;
    box.appendChild(repDiv);
  } else {
    // No vinculado: puede seleccionar
    const selRep = document.createElement("select");
    selRep.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;margin-bottom:12px;background:#fff;";
    selRep.appendChild(Object.assign(document.createElement("option"),{value:"",textContent:"-- Seleccionar repartidor --"}));
    (state.listaRepartidores||[]).forEach(r=>{ const nom=typeof r==="string"?r:(r.nombre||""); const alias=typeof r==="object"&&r.alias?r.alias:nom; const o=document.createElement("option"); o.value=nom; o.textContent=alias; selRep.appendChild(o); });
    selRep.value = state.loginRepartidor || "";
    selRep.addEventListener("change", e=>{ state.loginRepartidor=e.target.value; });
    box.appendChild(selRep);
  }

  // ── Auxiliar ──
  box.appendChild(lbl("👷 Auxiliar", true));
  const selAux = document.createElement("select");
  selAux.id = "sel-aux-entrega";
  selAux.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;margin-bottom:12px;background:#fff;";
  selAux.appendChild(Object.assign(document.createElement("option"),{value:"",textContent:"-- Seleccionar auxiliar --"}));
  (state.listaAuxiliares||[]).forEach(a=>{ const nom=typeof a==="string"?a:(a.nombre||""); const alias=typeof a==="object"&&a.alias?a.alias:nom; const o=document.createElement("option"); o.value=nom; o.textContent=alias; selAux.appendChild(o); });
  selAux.value = "";
  selAux.addEventListener("change", e=>{
    state.loginAuxiliar=e.target.value;
    selAux.style.borderColor=e.target.value?"#ccc":"#ccc";
    document.querySelectorAll(".ast-campo").forEach(a=>{ if(a) a.style.color="#bbb"; });
    const ley=document.getElementById("leyenda-ent"); if(ley) ley.style.color="#bbb";
  });
  box.appendChild(selAux);

  // ── Fecha ──
  box.appendChild(lbl("📅 Fecha de entrega", false));
  const fechaDiv = document.createElement("div");
  fechaDiv.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e0e0e0;font-size:14px;box-sizing:border-box;background:#f8f8f8;color:#555;margin-bottom:20px;";
  const [fy,fm,fd]=(state.loginFechaEntrega||hoy()).split("-");
  const diasN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const mesesN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const dtN=new Date(Number(fy),Number(fm)-1,Number(fd));
  fechaDiv.textContent=`${diasN[dtN.getDay()]}, ${Number(fd)} de ${mesesN[dtN.getMonth()]} de ${fy}`;
  box.appendChild(fechaDiv);

  // ── Leyenda obligatorios ──
  const leyenda = document.createElement("div");
  leyenda.id = "leyenda-ent";
  leyenda.style.cssText = "font-size:11px;color:#bbb;margin-bottom:14px;";
  leyenda.textContent = "* campo obligatorio";
  box.appendChild(leyenda);

  // ── Error ──
  const errP = document.createElement("p");
  errP.id = "err-seleccion-entrega";
  errP.style.cssText = "color:#c00;font-size:12px;margin:0 0 10px;min-height:16px;";
  box.appendChild(errP);

  // ── Botón Continuar ──
  const btnCont = document.createElement("button");
  btnCont.textContent = "Continuar →";
  btnCont.style.cssText = "width:100%;background:#27ae60;color:#fff;border:none;border-radius:10px;padding:14px 0;font-size:15px;font-weight:700;cursor:pointer;font-family:sans-serif;";
  btnCont.onclick = async () => {
    const repFinal = repNombre || state.loginRepartidor || "";
    const auxFinal = state.loginAuxiliar || "";
    let valido = true;
    if(!auxFinal) {
      document.querySelectorAll(".ast-campo").forEach(a=>{ a.style.color="#e53935"; });
      const ley=document.getElementById("leyenda-ent"); if(ley) ley.style.color="#e53935";
      errP.textContent = "Selecciona el auxiliar antes de continuar.";
      valido = false;
    }
    if(!valido) return;
    errP.textContent = "";
    // Guardar en state y continuar
    state.loginRepartidor = repFinal;
    guardarPersonalLocal();
    // Marcar en datos-dia a quién pertenece esta sesión de entrega
    try {
      const dd = await fbGet("datos-dia") || {};
      if(!dd.repartidor || dd.repartidor !== repFinal) {
        await fbSet("datos-dia", {...dd, repartidor: repFinal, auxiliar: auxFinal});
      }
    } catch(e){}
    setState({screen: tieneData ? "main" : "nodatos"});
  };
  box.appendChild(btnCont);

  wrap.appendChild(box);
  return wrap;
}

// ── Historial filtrado por repartidor (para rol repartidor) ──
async function abrirHistorialRepartidor() {
  const data = await fbGet("historial") || {};
  const repNombre = state.loginRepartidor || (state.repartidorVinculado
    ? (typeof state.repartidorVinculado==="string"?state.repartidorVinculado:(state.repartidorVinculado.nombre||""))
    : "");
  // Filtrar solo fechas donde este repartidor aparece (por campo repartidor guardado)
  // Por ahora cargamos todo y filtramos por nombre en el futuro cuando se guarde el repartidor en el historial
  const fechas = Object.keys(data).sort().reverse();
  setState({historialData:data, fechaSelec:fechas[0]||"", screen:"historial",
    historialFiltroRep: repNombre}); // filtro a aplicar en renderHistorial
}

  const iNueva=mkInp("Nueva contraseña","Nueva (mín. 4 caracteres)");
  const iConf=mkInp("Confirmar nueva","Repite la nueva contraseña");
  const errP=document.createElement("p"); errP.style.cssText="color:#c00;font-size:12px;margin:0 0 10px;min-height:16px;"; box.appendChild(errP);
  const btnRow=document.createElement("div"); btnRow.style.cssText="display:flex;gap:10px;";
  const btnG=document.createElement("button"); btnG.textContent="💾 Guardar";
  btnG.style.cssText="flex:1;background:#c0392b;color:#fff;border:none;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
  btnG.onclick=async()=>{
    const a=iActual.value.trim(),n=iNueva.value.trim(),c=iConf.value.trim();
    if(!a||!n||!c){errP.textContent="Completa todos los campos.";return;}
    if(a!==PASS_DESBLOQUEO){errP.textContent="La contraseña actual no es correcta.";return;}
    if(n.length<4){errP.textContent="Mínimo 4 caracteres.";return;}
    if(n!==c){errP.textContent="Las contraseñas no coinciden.";return;}
    btnG.textContent="Guardando..."; btnG.disabled=true;
    try {
      const cfg=await fbGet("config")||{};
      await fbSet("config",{...cfg,passDesbloqueo:n});
      PASS_DESBLOQUEO=n; overlay.remove(); showToast("✅ Contraseña de desbloqueo actualizada","#27ae60");
    } catch(e){ errP.textContent="Error al guardar."; btnG.textContent="💾 Guardar"; btnG.disabled=false; }
  };
  btnRow.appendChild(btnG);
  const btnC=document.createElement("button"); btnC.textContent="Cancelar";
  btnC.style.cssText="flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:11px 0;font-size:14px;cursor:pointer;font-family:sans-serif;";
  btnC.onclick=()=>overlay.remove();
  btnRow.appendChild(btnC); box.appendChild(btnRow);
  overlay.appendChild(box);
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
  setTimeout(()=>iActual.focus(),100);
}

// ── Modal gestionar tipos de devolución ──
function abrirModalMotivos() {
  const prev = document.getElementById("modal-motivos");
  if(prev) prev.remove();
  let motivosLocal = JSON.parse(JSON.stringify(MOTIVOS));
  const overlay = document.createElement("div");
  overlay.id = "modal-motivos";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;font-family:sans-serif;";
  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:14px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;";

  const renderContenido = () => {
    box.innerHTML = "";
    const titulo=document.createElement("h3"); titulo.textContent="↩️ Tipos de devolución";
    titulo.style.cssText="margin:0 0 4px;color:#d35400;font-size:16px;"; box.appendChild(titulo);
    const desc=document.createElement("p"); desc.textContent="Agrega, edita o elimina los motivos de devolución disponibles.";
    desc.style.cssText="font-size:12px;color:#888;margin:0 0 16px;"; box.appendChild(desc);
    motivosLocal.forEach((m,idx)=>{
      const fila=document.createElement("div"); fila.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:10px;";
      const iCod=document.createElement("input"); iCod.type="text"; iCod.value=m.codigo; iCod.placeholder="Cód";
      iCod.style.cssText="width:70px;padding:8px 10px;border-radius:8px;border:1px solid #ccc;font-size:13px;box-sizing:border-box;font-family:sans-serif;flex-shrink:0;";
      iCod.addEventListener("input",e=>{motivosLocal[idx].codigo=e.target.value.toUpperCase().slice(0,5);iCod.value=motivosLocal[idx].codigo;});
      const iDesc=document.createElement("input"); iDesc.type="text"; iDesc.value=m.desc; iDesc.placeholder="Descripción";
      iDesc.style.cssText="flex:1;padding:8px 10px;border-radius:8px;border:1px solid #ccc;font-size:13px;box-sizing:border-box;font-family:sans-serif;";
      iDesc.addEventListener("input",e=>{motivosLocal[idx].desc=e.target.value;});
      const btnD=document.createElement("button"); btnD.textContent="🗑️";
      btnD.style.cssText="background:#fce4ec;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;flex-shrink:0;";
      btnD.onclick=()=>{ showModal({titulo:"🗑️ Eliminar motivo", mensaje:'¿Eliminar "'+m.desc+'"?', tipo:"confirm", btnAceptar:"Eliminar", colorAceptar:"#c0392b", btnCancelar:"Cancelar", onAceptar:()=>{motivosLocal.splice(idx,1);renderContenido();} }); };
      fila.appendChild(iCod);fila.appendChild(iDesc);fila.appendChild(btnD);box.appendChild(fila);
    });
    const btnAgr=document.createElement("button"); btnAgr.textContent="➕ Agregar motivo";
    btnAgr.style.cssText="width:100%;background:#fff3e0;color:#d35400;border:2px dashed #d35400;border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-top:4px;margin-bottom:18px;";
    btnAgr.onclick=()=>{
      const nums=motivosLocal.map(m=>parseInt((m.codigo||"").replace(/[^0-9]/g,""))||0);
      const next="D"+String(Math.max(0,...nums)+1).padStart(2,"0");
      motivosLocal.push({codigo:next,desc:""}); renderContenido();
    };
    box.appendChild(btnAgr);
    const errP=document.createElement("p"); errP.style.cssText="color:#c00;font-size:12px;margin:0 0 10px;min-height:16px;"; box.appendChild(errP);
    const btnRow=document.createElement("div"); btnRow.style.cssText="display:flex;gap:10px;";
    const btnG=document.createElement("button"); btnG.textContent="💾 Guardar cambios";
    btnG.style.cssText="flex:1;background:#d35400;color:#fff;border:none;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
    btnG.onclick=async()=>{
      for(const m of motivosLocal){if(!m.codigo.trim()||!m.desc.trim()){errP.textContent="Todos deben tener código y descripción.";return;}}
      const cods=motivosLocal.map(m=>m.codigo.trim());
      if(new Set(cods).size!==cods.length){errP.textContent="Hay códigos repetidos.";return;}
      btnG.textContent="Guardando..."; btnG.disabled=true;
      try {
        const cfg=await fbGet("config")||{};
        await fbSet("config",{...cfg,motivos:motivosLocal});
        MOTIVOS=motivosLocal; overlay.remove(); showToast("✅ Tipos de devolución actualizados","#27ae60");
      } catch(e){errP.textContent="Error al guardar."; btnG.textContent="💾 Guardar cambios"; btnG.disabled=false;}
    };
    btnRow.appendChild(btnG);
    const btnC=document.createElement("button"); btnC.textContent="Cancelar";
    btnC.style.cssText="flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:11px 0;font-size:14px;cursor:pointer;font-family:sans-serif;";
    btnC.onclick=()=>overlay.remove(); btnRow.appendChild(btnC); box.appendChild(btnRow);
  };
  renderContenido();
  overlay.appendChild(box);
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
}

// ── Modal de usuario (independiente del ciclo render) ──
function abrirModalUsuario(usuarioExistente) {
  // Eliminar modal previo si existe
  const prev = document.getElementById("modal-usuario");
  if(prev) prev.remove();

  const editando = !!usuarioExistente;
  const datos = usuarioExistente ? {...usuarioExistente} : {nombre:"",email:"",pass:"",rol:"repartidor",id:null};

  const overlay = document.createElement("div");
  overlay.id = "modal-usuario";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;font-family:sans-serif;";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:14px;padding:28px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;";

  const titulo = document.createElement("h3");
  titulo.textContent = editando ? "✏️ Editar usuario" : "➕ Nuevo usuario";
  titulo.style.cssText = "margin:0 0 20px;color:#6c3483;font-size:16px;";
  box.appendChild(titulo);

  // Helper campo
  const campo = (label, tipo, valorInicial, placeholder) => {
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "14px";
    const lbl = document.createElement("label");
    lbl.textContent = label;
    lbl.style.cssText = "display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;";
    const inp = document.createElement("input");
    inp.type = tipo; inp.value = valorInicial; inp.placeholder = placeholder;
    inp.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;";
    wrap.appendChild(lbl); wrap.appendChild(inp);
    return {wrap, inp};
  };

  const {wrap:wNombre, inp:iNombre} = campo("Nombre de usuario","text",datos.nombre,"Ej: Juan");
  box.appendChild(wNombre);

  // Select rol
  const wRol = document.createElement("div"); wRol.style.marginBottom="14px";
  const lRol = document.createElement("label"); lRol.textContent="Rol";
  lRol.style.cssText="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;";
  const selRol = document.createElement("select");
  selRol.style.cssText="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;";
  [["repartidor","🚚 Repartidor"],["admin","👑 Administrador"]].forEach(([v,t])=>{
    const o=document.createElement("option"); o.value=v; o.textContent=t;
    if(datos.rol===v) o.selected=true;
    selRol.appendChild(o);
  });
  wRol.appendChild(lRol); wRol.appendChild(selRol); box.appendChild(wRol);

  // Correo (solo admin)
  const {wrap:wEmail, inp:iEmail} = campo("Correo (para recuperación de contraseña)","email",datos.email||"","correo@ejemplo.com");
  box.appendChild(wEmail);

  // Contraseña
  const passLabel = editando && datos.rol==="repartidor" ? "Nueva contraseña (vacío = no cambiar)" : "Contraseña";
  const passPlaceholder = datos.rol==="admin" ? "Mínimo 6 caracteres" : "Contraseña de acceso";
  const {wrap:wPass, inp:iPass} = campo(passLabel,"password",datos.pass||"",passPlaceholder);

  // Nota admin no puede cambiar pass aquí
  const notaAdmin = document.createElement("div");
  notaAdmin.style.cssText="background:#fff8e1;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#795548;";
  notaAdmin.textContent="💡 Para cambiar la contraseña del admin, usa '¿Olvidaste tu contraseña?' en el login.";

  // ── Vínculo con repartidor (solo rol repartidor) ──
  const wVinculo = document.createElement("div"); wVinculo.style.marginBottom="14px";
  const lVinculo = document.createElement("label"); lVinculo.textContent="🔗 Repartidor vinculado";
  lVinculo.style.cssText="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;";
  const selVinculo = document.createElement("select");
  selVinculo.style.cssText="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;font-family:sans-serif;background:#fff;";
  selVinculo.appendChild(Object.assign(document.createElement("option"),{value:"",textContent:"-- Sin vincular --"}));
  (state.listaRepartidores||[]).forEach(r=>{
    const nom=typeof r==="string"?r:(r.nombre||"");
    const alias=typeof r==="object"&&r.alias?r.alias:nom;
    const o=document.createElement("option"); o.value=nom;
    o.textContent=alias+(alias!==nom?" ("+nom+")":"");
    if((datos.repartidorVinculado||"")=== nom) o.selected=true;
    selVinculo.appendChild(o);
  });
  const descVinculo=document.createElement("p");
  descVinculo.textContent="Al vincular, el sistema precarga automáticamente el nombre del repartidor al momento de entregar.";
  descVinculo.style.cssText="font-size:11px;color:#aaa;margin:4px 0 0;";
  wVinculo.appendChild(lVinculo); wVinculo.appendChild(selVinculo); wVinculo.appendChild(descVinculo);

  const actualizarCamposRol = () => {
    const esAdmin = selRol.value === "admin";
    wEmail.style.display = esAdmin ? "block" : "none";
    wVinculo.style.display = esAdmin ? "none" : "block";
    if(editando && esAdmin) {
      if(wPass.parentNode) wPass.remove();
      if(wVinculo.parentNode) wVinculo.remove();
      if(!notaAdmin.parentNode) box.insertBefore(notaAdmin, errP.parentNode ? errP : btnRow);
    } else {
      if(notaAdmin.parentNode) notaAdmin.remove();
      if(!wPass.parentNode) box.insertBefore(wPass, errP.parentNode ? errP : btnRow);
      if(!wVinculo.parentNode) box.insertBefore(wVinculo, wPass.parentNode ? wPass : (errP.parentNode ? errP : btnRow));
    }
  };
  selRol.addEventListener("change", actualizarCamposRol);

  // Error
  const errP = document.createElement("p");
  errP.style.cssText="color:#c00;font-size:12px;margin:0 0 10px;display:none;";
  box.appendChild(errP);

  // Botones
  const btnRow = document.createElement("div");
  btnRow.style.cssText="display:flex;gap:10px;margin-top:4px;";
  const btnGuardar = document.createElement("button");
  btnGuardar.textContent="💾 Guardar";
  btnGuardar.style.cssText="flex:1;background:#6c3483;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
  const btnCancelar = document.createElement("button");
  btnCancelar.textContent="Cancelar";
  btnCancelar.style.cssText="flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
  btnCancelar.addEventListener("click",()=>overlay.remove());
  btnRow.appendChild(btnGuardar); btnRow.appendChild(btnCancelar);
  box.appendChild(wPass); box.appendChild(btnRow);

  // Inicializar visibilidad
  actualizarCamposRol();

  btnGuardar.addEventListener("click", async () => {
    const nombre = iNombre.value.trim();
    const rol = selRol.value;
    const email = iEmail.value.trim();
    const pass = iPass.value.trim();
    const esAdmin = rol === "admin";

    errP.style.display="none";
    const mostrarError = (msg) => { errP.textContent=msg; errP.style.display="block"; };

    if(!nombre) { mostrarError("El nombre es requerido."); return; }
    if(esAdmin && !email) { mostrarError("El correo es requerido para el administrador."); return; }
    if(!editando && !pass) { mostrarError("La contraseña es requerida."); return; }
    if(esAdmin && !editando && pass.length < 6) { mostrarError("La contraseña debe tener mínimo 6 caracteres."); return; }

    btnGuardar.disabled=true; btnGuardar.textContent="Guardando...";
    try {
      let uid = datos.id;
      if(!editando) {
        if(esAdmin) {
          const cred = await auth.createUserWithEmailAndPassword(email, pass);
          uid = cred.user.uid;
          const adminPerfil = await fbGet("usuarios/"+state.usuarioActual.id);
          if(adminPerfil?.email) {
            const adminPass = prompt("Confirma tu contraseña de administrador para continuar:");
            if(adminPass) await auth.signInWithEmailAndPassword(adminPerfil.email, adminPass);
          }
          await fbSet("usuarios/"+uid, {id:uid, nombre, email, rol:"admin"});
        } else {
          uid = nombre.toLowerCase().replace(/[^a-z0-9]/g,"_")+"_"+Date.now();
          await fbSet("usuarios/"+uid, {id:uid, nombre, pass, rol:"repartidor", repartidorVinculado:selVinculo.value||""});
        }
      } else {
        const updates = {...datos, nombre, rol};
        if(esAdmin) updates.email = email;
        if(!esAdmin && pass) updates.pass = pass;
        if(!esAdmin) updates.repartidorVinculado = selVinculo.value || "";
        await fbSet("usuarios/"+uid, updates);
      }
      const usu = await fbGet("usuarios") || {};
      state.adminUsuarios = usu;
      overlay.remove();
      render();
      showToast("✅ Usuario guardado","#27ae60");
    } catch(e) {
      let msg="Error al guardar.";
      if(e.code==="auth/email-already-in-use") msg="Ese correo ya está registrado.";
      else if(e.code==="auth/weak-password") msg="Contraseña muy débil (mín. 6 caracteres).";
      mostrarError(msg);
      btnGuardar.disabled=false; btnGuardar.textContent="💾 Guardar";
    }
  });

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=>iNombre.focus(),100);
}

// ── Admin: gestión de usuarios ──
function renderAdminUsuarios() {
  const wrap=el("div",{style:{fontFamily:"sans-serif",background:"#f4f6f9",minHeight:"100vh",padding:"24px"}});
  const inner=el("div",{style:{maxWidth:"600px",margin:"0 auto"}});
  wrap.appendChild(inner);

  const hdr=el("div",{style:{background:"#6c3483",color:"#fff",borderRadius:"12px",padding:"16px 24px",marginBottom:"20px",display:"flex",justifyContent:"space-between",alignItems:"center"}});
  hdr.appendChild(el("div",{},[
    el("h1",{style:{margin:"0",fontSize:"20px"}},"👥 Usuarios"),
    el("p",{style:{margin:"4px 0 0",fontSize:"12px",opacity:"0.7"}},"Administrar acceso a la aplicación")
  ]));
  hdr.appendChild(el("button",{style:{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",borderRadius:"8px",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"700"},onClick:()=>setState({screenAdmin:null,screen:"menu"})},"← Volver"));
  inner.appendChild(hdr);

  // Botón nuevo usuario
  inner.appendChild(el("button",{style:{width:"100%",background:"#6c3483",color:"#fff",border:"none",borderRadius:"10px",padding:"12px",fontSize:"14px",fontWeight:"700",cursor:"pointer",marginBottom:"16px"},onClick:()=>abrirModalUsuario(null)},"+ Nuevo usuario"));

  // Lista de usuarios
  const usu = state.adminUsuarios || {};
  const lista = Object.values(usu);
  if(lista.length===0) {
    inner.appendChild(el("div",{style:{background:"#fff",borderRadius:"12px",padding:"32px",textAlign:"center",color:"#aaa"}},"No hay usuarios registrados."));
  } else {
    lista.sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).forEach(u=>{
      const row=el("div",{style:{background:"#fff",borderRadius:"12px",padding:"16px 20px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"12px",boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}});
      const ava=el("div",{style:{width:"40px",height:"40px",borderRadius:"50%",background:u.rol==="admin"?"#6c3483":"#2980b9",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:"0"}},u.rol==="admin"?"👑":"🚚");
      row.appendChild(ava);
      const info=el("div",{style:{flex:"1"}});
      info.appendChild(el("div",{style:{fontWeight:"700",color:"#1e3a5f",fontSize:"14px"}},u.nombre||u.email));
      info.appendChild(el("div",{style:{fontSize:"12px",color:"#888",marginTop:"2px"}},(u.rol==="admin"?"👑 Administrador":"🚚 Repartidor")+" · "+(u.email||"")));
      row.appendChild(info);
      const esCurrent = state.usuarioActual?.id === u.id;
      if(!esCurrent) {
        const acciones=el("div",{style:{display:"flex",gap:"8px"}});
        acciones.appendChild(el("button",{style:{background:"#eef2f7",border:"none",borderRadius:"6px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",color:"#1e3a5f",fontWeight:"700"},onClick:()=>abrirModalUsuario({...u,editando:true})},"✏️"));
        acciones.appendChild(el("button",{style:{background:"#fdecea",border:"none",borderRadius:"6px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",color:"#c0392b",fontWeight:"700"},onClick:()=>eliminarUsuario(u.id)},"🗑️"));
        row.appendChild(acciones);
      } else {
        row.appendChild(el("span",{style:{fontSize:"11px",color:"#27ae60",fontWeight:"700"}},"(tú)"));
      }
      inner.appendChild(row);
    });
  }
  return wrap;
}

// ── Arranque ──
// Si Firebase tarda más de 2 segundos, mostrar login de todas formas
setTimeout(()=>{ if(!_authResuelto) { _authResuelto=true; render(); } }, 2000);

auth.onAuthStateChanged(async (user) => {
  if(_loginEnProceso) return;
  _authResuelto = true;
  if(user && !state.autenticado) {
    try {
      const perfil = await fbGet("usuarios/"+user.uid);
      if(perfil && perfil.rol === "admin") {
        const usuario = {id:user.uid, nombre:perfil.nombre||user.email, rol:"admin", email:user.email};
        await iniciarSesionConUsuario(usuario);
        return;
      }
    } catch(e){}
  }
  if(!state.autenticado) render();
});
</script>
