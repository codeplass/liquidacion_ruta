// ── Helpers ──
const fQ = v => `Q ${Number(v||0).toLocaleString("es-GT",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fN = v => Number(v||0).toLocaleString("es-GT");
const hoy = () => { const d=new Date(); const off=d.getTimezoneOffset(); const local=new Date(d.getTime()-off*60000); return local.toISOString().slice(0,10); };
const toNum = v => { const n=parseFloat(String(v||"").replace(/[Q,\s]/g,"")); return isNaN(n)?0:n; };
const esRuta = v => typeof v==="string" && /^ruta\s*\d+/i.test(v.trim());
const esCliente = v => typeof v==="string" && /^PT\d+/i.test(v.trim());
const esProducto = v => typeof v==="string" && /^\[\d+\]/.test(v.trim());
const esPedido = v => typeof v==="string" && /^SO\d+/i.test(v.trim());
const esNota = v => typeof v==="string" && v.trim().startsWith("📝");

// ── Firebase helpers ──
async function fbGet(path) {
  const snap = await db.ref(path).once("value");
  return snap.val();
}
async function fbSet(path, data) {
  await db.ref(path).set(data);
}
async function fbRemove(path) {
  await db.ref(path).remove();
}

// ── Parse archivo ──
function parseFile(raw) {
  const map={};
  let ruta="",cliente="",pedidoDefault="";
  for(let i=0;i<raw.length;i++){
    const cells=Array.isArray(raw[i])?raw[i]:Object.values(raw[i]);
    const A=String(cells[0]||"").trim();
    const B=String(cells[1]||"").trim();
    if(cells.every(c=>c===""||c===null||c===undefined)) continue;
    if(esRuta(A)){ruta=A;continue;}
    if(esCliente(A)){
      const partes=A.split(/\s[—–-]+\s|\s{2,}/);
      const codigo=partes[0].trim();
      const nombre=partes.slice(1).join(" ").trim()||B;
      // El pedido en la fila del cliente puede ser "SO63077 / SO63089" (múltiples)
      // El pedido real de cada producto viene en columna C de la línea del producto
      const pedCol=String(cells[2]||"").trim();
      const primerPed=pedCol.split(/[/,\s]+/).map(x=>x.trim()).find(x=>esPedido(x)||/^[A-Z]{1,3}\d{4,}/i.test(x))||"S/N";
      cliente=nombre?`${codigo} - ${nombre}`:codigo;
      pedidoDefault=primerPed;
      if(!map[cliente]) map[cliente]={ruta,pedidos:{}};
      continue;
    }
    // Línea con valor: producto con código [nnn] O texto libre con unidades/monto distintos de cero
    const esLineaValor = A && !esRuta(A) && !esCliente(A) && !esNota(A) && cliente &&
      (esProducto(A) || (toNum(cells[4])!==0 || toNum(cells[5])!==0));
    if(esLineaValor){
      // Col C (índice 2): número de pedido del producto
      // Col D (índice 3): Est.ped ("Blo", "Pre", etc.)
      // Col E (índice 4): cantidad
      // Col F (índice 5): monto
      const pedProd=String(cells[2]||"").trim();
      const estPed=String(cells[3]||"").trim();
      const pedido=(esPedido(pedProd)||/^[A-Z]{1,3}\d{4,}/i.test(pedProd))?pedProd:pedidoDefault;
      const unidades=toNum(cells[4]);
      const monto=toNum(cells[5]);
      if(unidades!==0||monto!==0){
        if(!map[cliente].pedidos[pedido]) map[cliente].pedidos[pedido]={lineas:[],estPed:""};
        if(estPed) map[cliente].pedidos[pedido].estPed=estPed;
        map[cliente].pedidos[pedido].lineas.push({producto:A,unidades,monto,estPed});
      }
    }
    if(esNota(A)&&cliente){
      const textoNota=A.replace(/^📝\s*/,'').trim();
      if(textoNota){
        if(!map[cliente].pedidos[pedidoDefault]) map[cliente].pedidos[pedidoDefault]={lineas:[],estPed:""};
        map[cliente].pedidos[pedidoDefault].nota=textoNota;
      }
    }
  }
  // Post-proceso: un pedido es "Pre" si TODOS sus productos son Pre
  Object.values(map).forEach(cl=>{
    Object.values(cl.pedidos).forEach(ped=>{
      if(ped.lineas.length===0) return;
      const todosPre=ped.lineas.every(l=>/^pre$/i.test(l.estPed||""));
      ped.estPed=todosPre?"Pre":(ped.lineas.some(l=>/^blo$/i.test(l.estPed||""))?"Blo":"");
    });
  });
  return map;
}

const PANTALLAS_FLUJO = new Set([
  "main","resumenEntregas","resumenLiq","resumenDevs","historialVista","confirmado"
]);

function _setStateInterno(updates) {
  Object.assign(state, updates);
  render();
  // Guardado automático en Firebase cuando cambian datos del día
  // Autosave: solo datos de entregas (no cuadre — ese solo se guarda al confirmar)
  const camposGuardar = ["estadoEntrega","entregados","bloqueados",
    "motivosDevTotal","descuentos","comentarios","pagoPendiente"];
  const afecta = Object.keys(updates).some(k => camposGuardar.includes(k));
  if(afecta && state.autenticado && state.clienteMap && Object.keys(state.clienteMap).length > 0){
    clearTimeout(window._autoSaveTimer);
    window._autoSaveTimer = setTimeout(async () => {
      try {
        const actual = await fbGet("datos-dia");
        if(actual) {
          await fbSet("datos-dia", {
            ...actual,
            estadoEntrega: state.estadoEntrega,
            entregados: state.entregados,
            bloqueados: state.bloqueados,
            devoluciones: state.devoluciones,
            motivosDevTotal: state.motivosDevTotal,
            descuentos: state.descuentos,
            comentarios: state.comentarios,
            pagoPendiente: state.pagoPendiente
          });
        }
      } catch(e) { console.warn("AutoSave error:", e); }
    }, 1500);
  }
}

function setState(updates) {
  // Guard: si hay cambio de pantalla que SALE del flujo activo, preguntar
  if("screen" in updates) {
    const screenActual = state.screen;
    const screenNueva  = updates.screen;
    const enFlujo      = PANTALLAS_FLUJO.has(screenActual);
    const saleDeFlujo  = !PANTALLAS_FLUJO.has(screenNueva);
    const hayDatos     = state.autenticado && Object.keys(state.clienteMap||{}).length > 0;
    const noConfirmado = !state.confirmado && !state.modoHistorial;

    if(enFlujo && saleDeFlujo && hayDatos && noConfirmado) {
      showModal({
        titulo: "⚠️ Cambios sin confirmar",
        mensaje: "La liquidación tiene cambios sin confirmar que se perderán.\n\n¿Deseas salir de todas formas?",
        tipo: "confirm",
        btnAceptar: "🚪 Salir sin guardar",
        colorAceptar: "#c0392b",
        btnCancelar: "📋 Quedarme",
        onAceptar: () => _setStateInterno(updates)
      });
      return; // no navegar hasta confirmar
    }
  }
  _setStateInterno(updates);
}

// ── Totales ──
// Helper: true si todos los pedidos del cliente son "Pre"
function esClientePre(c) {
  const pedidos = Object.values(state.clienteMap[c]?.pedidos||{});
  return pedidos.length > 0 && pedidos.every(p=>/^pre$/i.test(p.estPed||""));
}
// Helper: true si un pedido específico es "Pre"
const esPedPre = p => /^pre$/i.test(p?.estPed||"");

function totalesCliente(c) {
  let u=0,m=0;
  Object.values(state.clienteMap[c]?.pedidos||{}).forEach(p=>{
    if(esPedPre(p)) return; // excluir pedidos en presupuesto
    p.lineas.forEach(l=>{u+=l.unidades;m+=l.monto;});
  });
  const devs=state.devoluciones.filter(d=>d.cliente===c);
  const dU=devs.reduce((s,d)=>s+d.unidades,0),dM=devs.reduce((s,d)=>s+d.monto,0);
  const desc=parseFloat(state.descuentos[c])||0;
  return {unidades:u,monto:m,devU:dU,devM:dM,desc,netoU:u-dU,netoM:m-dM-desc};
}

function estadoCliente(c) {
  // verde: confirmado sin devoluciones
  // amarillo: confirmado con devoluciones parciales
  // rosado: devolucion total (neto = 0)
  // null: no confirmado
  const est = state.estadoEntrega[c];
  return est || null;
}

function totalesGral() {
  return Object.keys(state.clienteMap).reduce((acc,c)=>{
    if(esClientePre(c)) return acc;
    const t=totalesCliente(c);
    acc.unidades+=t.unidades;acc.monto+=t.monto;acc.devM+=t.devM;acc.desc+=t.desc;acc.netoM+=t.netoM;
    return acc;
  },{unidades:0,monto:0,devM:0,desc:0,netoM:0});
}

function prodsDisp(c,p) {
  return (state.clienteMap[c]?.pedidos?.[p]?.lineas||[]).map(l=>{
    const yU=state.devoluciones.filter(d=>d.cliente===c&&d.pedido===p&&d.producto===l.producto).reduce((s,d)=>s+d.unidades,0);
    const yM=state.devoluciones.filter(d=>d.cliente===c&&d.pedido===p&&d.producto===l.producto).reduce((s,d)=>s+d.monto,0);
    return {...l,dispU:l.unidades-yU,dispM:l.monto-yM};
  }).filter(l=>l.dispU>0);
}

function precioUnit(cliente,pedido,producto) {
  const linea=state.clienteMap[cliente]?.pedidos?.[pedido]?.lineas?.find(l=>l.producto===producto);
  if(!linea||linea.unidades===0) return 0;
  return linea.monto/linea.unidades;
}

async function iniciarSesionConUsuario(usuario) {
  _loginEnProceso = false;
  const admin = usuario.rol === "admin";
  guardarSesionLocal(usuario);
  guardarPersonalLocal();
  setState({autenticado:true, esAdmin:admin, usuarioActual:usuario, appPassError:"", cargandoDatos:true});
  // Cargar config desde Firebase (pass desbloqueo, motivos, personal)
  try {
    const cfg=await fbGet("config")||{};
    if(cfg.passDesbloqueo) PASS_DESBLOQUEO=cfg.passDesbloqueo;
    if(cfg.motivos && Array.isArray(cfg.motivos) && cfg.motivos.length>0) MOTIVOS=cfg.motivos;
    const reps=Array.isArray(cfg.personal?.repartidores)?cfg.personal.repartidores:[];
    const auxs=Array.isArray(cfg.personal?.auxiliares)?cfg.personal.auxiliares:[];
    state.listaRepartidores=reps;
    state.listaAuxiliares=auxs;
    // Siempre en blanco al iniciar sesión (selección obligatoria cada vez)
    state.loginRepartidor="";
    state.loginAuxiliar="";
    // Vincular usuario al repartidor por el campo repartidorVinculado guardado en Firebase
    const nomVinc = usuario.repartidorVinculado || "";
    const repVinculado = nomVinc
      ? (reps.find(r=>(typeof r==="string"?r:(r.nombre||""))===nomVinc) || {nombre:nomVinc, alias:""})
      : null;
    state.repartidorVinculado = repVinculado;
    if(repVinculado) state.loginRepartidor = typeof repVinculado==="string"?repVinculado:(repVinculado.nombre||"");
  } catch(e){}
  const datos=await fbGet("datos-dia");
  // Para repartidores: verificar que los datos-dia les pertenecen
  // Si el campo repartidor existe y no coincide, ignorar los datos
  const repNombreActual = usuario.repartidorVinculado || "";
  const datosValidos = datos && datos.clienteMap && Object.keys(datos.clienteMap).length>0
    && (admin || !datos.repartidor || !repNombreActual || datos.repartidor===repNombreActual);
  if(datosValidos){
    const yaConfirmado = datos.confirmado === true;
    if(yaConfirmado && admin){
      setState({
        clienteMap:datos.clienteMap, fileName:datos.fileName||"", fecha:hoy(),
        estadoEntrega:datos.estadoEntrega||{}, entregados:datos.entregados||{},
        bloqueados:datos.bloqueados||{}, devoluciones:datos.devoluciones||[],
        motivosDevTotal:datos.motivosDevTotal||{}, descuentos:datos.descuentos||{},
        comentarios:datos.comentarios||{},
        billetes:datos.billetes||Object.fromEntries([1,5,10,20,50,100,200].map(b=>[b,""])),
        monedas:datos.monedas||"", deposito:datos.deposito||"", transferencia:datos.transferencia||"",
        gastosDetalle:datos.gastosDetalle||[{desc:"",monto:"",comentario:""}],
        pagoPendiente:datos.pagoPendiente||{},
        confirmado:true, screen:"opciones", cargandoDatos:false
      });
    } else {
      setState({
        clienteMap:datos.clienteMap, fileName:datos.fileName||"", fecha:hoy(),
        screen:admin?"menu":"menuRepartidor", cargandoDatos:false, confirmado:yaConfirmado,
        estadoEntrega:datos.estadoEntrega||{}, entregados:datos.entregados||{},
        bloqueados:datos.bloqueados||{}, devoluciones:datos.devoluciones||[],
        motivosDevTotal:datos.motivosDevTotal||{}, descuentos:datos.descuentos||{},
        comentarios:datos.comentarios||{},
        billetes:datos.billetes||Object.fromEntries([1,5,10,20,50,100,200].map(b=>[b,""])),
        monedas:datos.monedas||"", deposito:datos.deposito||"", transferencia:datos.transferencia||"",
        gastosDetalle:datos.gastosDetalle||[{desc:"",monto:"",comentario:""}],
        pagoPendiente:datos.pagoPendiente||{}
      });
    }
  } else {
    setState({screen:admin?"menu":"menuRepartidor", cargandoDatos:false,
      // Limpiar clienteMap si los datos no le pertenecen a este repartidor
      clienteMap:{}, devoluciones:[], estadoEntrega:{}, bloqueados:{},
      descuentos:{}, comentarios:{}, confirmado:false
    });
  }
}

async function iniciarSesion() {
  if(_loginEnProceso) return;
  const nombreInput = (state.appUser||"").trim();
  const pass = (state.appPass||"").trim();
  if(!nombreInput || !pass) { state.appPassError="Ingresa usuario y contraseña."; render(); return; }
  state.appPassError=""; state.cargandoDatos=true; _loginEnProceso=true; render();

  try {
    const usuarios = await fbGet("usuarios") || {};
    const found = Object.values(usuarios).find(u =>
      (u.nombre||"").toLowerCase() === nombreInput.toLowerCase()
    );

    if(!found) { state.appPassError="Usuario no encontrado."; state.cargandoDatos=false; _loginEnProceso=false; render(); return; }

    // Si es repartidor, verificar que no haya otro repartidor activo en datos-dia
    if(found.rol !== "admin") {
      try {
        const dd = await fbGet("datos-dia");
        const repActivo = dd?.repartidor || "";
        const repVinc = found.repartidorVinculado || "";
        if(repActivo && repVinc && repActivo !== repVinc) {
          state.appPassError = `Ya hay una sesión activa del repartidor "${repActivo}". Solo el administrador puede ingresar mientras haya una sesión de entrega activa.`;
          state.cargandoDatos=false; _loginEnProceso=false; render(); return;
        }
      } catch(e) {}
    }

    if(found.rol === "admin" && found.email) {
      try {
        const cred = await auth.signInWithEmailAndPassword(found.email, pass);
        const usuario = {id:cred.user.uid, nombre:found.nombre, rol:"admin", email:found.email};
        await iniciarSesionConUsuario(usuario);
      } catch(e) {
        let msg = "Contraseña incorrecta.";
        if(e.code==="auth/too-many-requests") msg="Demasiados intentos. Intenta más tarde.";
        state.appPassError=msg; state.cargandoDatos=false; _loginEnProceso=false; render();
      }
    } else {
      if(found.pass !== pass) { state.appPassError="Contraseña incorrecta."; state.cargandoDatos=false; _loginEnProceso=false; render(); return; }
      const usuario = {id:found.id, nombre:found.nombre, rol:found.rol||"repartidor", repartidorVinculado:found.repartidorVinculado||""};
      await iniciarSesionConUsuario(usuario);
    }
  } catch(e) {
    state.appPassError="Error al conectar. Verifica tu conexión."; state.cargandoDatos=false; _loginEnProceso=false; render();
  }
}

async function recuperarContrasena() {
  const nombreInput = (state.appUser||"").trim();
  if(!nombreInput) { setState({appPassError:"Ingresa tu nombre de usuario primero."}); return; }
  try {
    const usuarios = await fbGet("usuarios") || {};
    const found = Object.values(usuarios).find(u =>
      (u.nombre||"").toLowerCase() === nombreInput.toLowerCase()
    );
    if(!found || found.rol !== "admin" || !found.email) {
      setState({appPassError:"Solo el administrador puede recuperar su contraseña por correo."});
      return;
    }
    await auth.sendPasswordResetEmail(found.email);

}

// Guardar cambios del historial editado y re-confirmar en Firebase
async function guardarCambiosHistorial() {
  setState({guardando:true});
  try {
    const existing = await fbGet("historial") || {};
    const clienteTotales = {};
    Object.keys(state.clienteMap).forEach(c => {
      if(esClientePre(c)) return;
      if(!state.estadoEntrega[c]) return;
      let m=0;
      Object.values(state.clienteMap[c].pedidos||{}).forEach(p=>p.lineas.forEach(l=>{m+=l.monto;}));
      const devM=state.devoluciones.filter(d=>d.cliente===c).reduce((s,d)=>s+d.monto,0);
      const desc=parseFloat(state.descuentos[c])||0;
      clienteTotales[c] = m - devM - desc;
    });
    const totalNeto = Object.values(clienteTotales).reduce((s,v)=>s+v,0);
    existing[state.fecha]={
      ...(existing[state.fecha]||{}),
      fecha:state.fecha, fileName:state.fileName,
      repartidor:state.loginRepartidor||existing[state.fecha]?.repartidor||"",
      auxiliar:state.loginAuxiliar||existing[state.fecha]?.auxiliar||"",
      entregados:state.entregados,
      estadoEntrega:state.estadoEntrega,
      motivosDevTotal:state.motivosDevTotal,
      devoluciones:state.devoluciones,
      descuentos:state.descuentos, comentarios:state.comentarios,
      deposito:state.deposito, transferencia:state.transferencia,
      gastosDetalle:state.gastosDetalle, billetes:state.billetes, monedas:state.monedas,
      pagoPendiente:state.pagoPendiente,
      clienteTotales, totalNeto,
      clienteMap:state.clienteMap
    };
    await fbSet("historial", existing);
    // Actualizar copia local
    const nuevoData = {...state.historialData};
    nuevoData[state.fecha] = existing[state.fecha];
    setState({
      confirmado:true, showConfirmar:false, guardando:false,
      modoHistorial:true, bloqueados:Object.fromEntries(Object.keys(state.estadoEntrega).map(k=>[k,true])),
      historialData:nuevoData, screen:"historialVista"
    });
    showToast("✅ Cambios guardados en el historial","#27ae60");
  } catch(e) {
    console.error(e);
    setState({guardando:false, showConfirmar:false});
    showModal({titulo:"❌ Error al guardar", mensaje:"Error al guardar:\n"+e.message, tipo:"alert", btnAceptar:"Cerrar", colorAceptar:"#c0392b"});
  }
}

async function guardarUsuario() {
  const f = state.adminUsuForm;
  if(!f) return;
  const nombre = (f.nombre||"").trim();
  const pass = (f.pass||"").trim();
  const rol = f.rol || "repartidor";
  const email = (f.email||"").trim();

  if(!nombre) { setState({adminUsuError:"El nombre es requerido."}); return; }
  if(!f.editando && !pass) { setState({adminUsuError:"La contraseña es requerida."}); return; }
  if(rol === "admin" && !email) { setState({adminUsuError:"El correo es requerido para el administrador."}); return; }

  setState({adminUsuError:"", guardandoUsuario:true});
  try {
    let uid = f.id;
    if(!f.editando) {
      if(rol === "admin") {
        // Crear en Firebase Auth
        if(pass.length < 6) { setState({adminUsuError:"La contraseña debe tener mínimo 6 caracteres.", guardandoUsuario:false}); return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        uid = cred.user.uid;
        // Re-autenticar al admin actual
        const adminPerfil = await fbGet("usuarios/"+state.usuarioActual.id);
        if(adminPerfil?.email) {
          const adminPass = prompt("Para continuar, confirma tu contraseña de administrador:");
          if(adminPass) await auth.signInWithEmailAndPassword(adminPerfil.email, adminPass);
        }
        await fbSet("usuarios/"+uid, {id:uid, nombre, email, rol:"admin"});
      } else {
        // Repartidor: solo en DB
        uid = nombre.toLowerCase().replace(/[^a-z0-9]/g,"_")+"_"+Date.now();
        await fbSet("usuarios/"+uid, {id:uid, nombre, pass, rol:"repartidor"});
      }
    } else {
      // Editar: actualizar perfil
      const updates = {id:uid, nombre, rol};
      if(rol === "admin") updates.email = email;
      if(rol === "repartidor" && pass) updates.pass = pass;
      await fbSet("usuarios/"+uid, {...f, ...updates});
    }
    const usu = await fbGet("usuarios") || {};
    setState({adminUsuarios:usu, adminUsuForm:null, adminUsuError:"", guardandoUsuario:false});
    showToast("✅ Usuario guardado","#27ae60");
  } catch(e) {
    let msg = "Error al guardar usuario.";
    if(e.code==="auth/email-already-in-use") msg="Ese correo ya está registrado.";
    else if(e.code==="auth/weak-password") msg="Contraseña muy débil (mín. 6 caracteres).";
    setState({adminUsuError:msg, guardandoUsuario:false});
  }
}

async function procesarArchivo(file) {
  setState({error:""});
  try {
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    const map=parseFile(raw);
    if(!Object.keys(map).length){setState({error:"No se encontraron entregas."});return;}
    // Limpiar claves para Firebase (no permite . # $ / [ ])
    const cleanKey=k=>k.replace(/[.#$\/\[\]]/g,"_");
    const cleanMap={};
    Object.entries(map).forEach(([k,v])=>{
      const cleanPedidos={};
      Object.entries(v.pedidos||{}).forEach(([pk,pv])=>{cleanPedidos[cleanKey(pk)]={...pv,pedidoOriginal:pk};});
      cleanMap[cleanKey(k)]={...v,pedidos:cleanPedidos,nombreOriginal:k};
    });
    await fbSet("datos-dia",{clienteMap:cleanMap,fileName:file.name,fecha:state.fecha});
    setState({
      clienteMap:cleanMap,devoluciones:[],entregados:{},estadoEntrega:{},motivosDevTotal:{},descuentos:{},comentarios:{},bloqueados:{},
      deposito:"",transferencia:"",gastosDetalle:[{desc:"",monto:"",comentario:"",deCuenta:true}],
      billetes:Object.fromEntries(BILLETES.map(b=>[b,""])),monedas:"",confirmado:false,
      fileName:file.name,screen:"main",busqueda:""
    });
  } catch(e){setState({error:"Error: "+e.message});}
}

async function exportarExcel(reg) {
  const wb=XLSX.utils.book_new();
  const devs=reg.devoluciones||[];
  const descs=reg.descuentos||{};
  const coments=reg.comentarios||{};
  const estadoEnt=reg.estadoEntrega||reg.entregados||{};
  const cMap=reg.clienteMap||{};
  const gastos=reg.gastosDetalle||[];
  const billetes=reg.billetes||{};
  // Usar SOLO clientes del clienteMap — no incluir estadoEnt ni devs porque pueden
  // contener clientes de otras rutas/días que no pertenecen a este archivo del día
  const clts=Object.keys(cMap).filter(Boolean).filter(c=>{ const ps=Object.values(cMap[c]?.pedidos||{}); return !(ps.length>0&&ps.every(p=>/^pre$/i.test(p.estPed||""))); }).sort();

  // ── Hoja 1: Resumen ──
  // Fix obs.2: devoluciones siempre se muestran en columna Devoluciones (positivo),
  // Total neto = bruto - devoluciones - descuentos
  let sB=0,sD=0,sDe=0,sN=0;
  const resRows=[["Ruta","Cliente","Estado","Total bruto Q","Devoluciones Q","Descuento Q","Total neto Q","Pago pendiente","Comentario"]];
  const cltsSorted=[...clts].sort((a,b)=>{
    const ra=cMap[a]?.ruta||"ZZZ", rb=cMap[b]?.ruta||"ZZZ";
    return ra.localeCompare(rb);
  });
  cltsSorted.forEach(c=>{
    const ruta=cMap[c]?.ruta||"";
    const est=estadoEnt[c];
    const lbl=est==="verde"?"Entregado":est==="amarillo"?"Parcial":est==="rosado"?"Dev. total":"Pendiente";
    let bruto=0; Object.values(cMap[c]?.pedidos||{}).forEach(p=>p.lineas.forEach(l=>{bruto+=l.monto;}));
    // Devoluciones: si rosado = bruto completo; si amarillo = devs parciales registradas
    const dv = est==="rosado" ? bruto : devs.filter(d=>d.cliente===c).reduce((s,d)=>s+d.monto,0);
    const dc = est==="rosado" ? 0 : (parseFloat(descs[c])||0);
    const nt = bruto - dv - dc;
    sB+=bruto; sD+=dv; sDe+=dc; sN+=nt;
    // dv como positivo en la columna, neto ya refleja la resta
    resRows.push([ruta,c,lbl,bruto,dv>0?dv:0,dc>0?dc:0,nt,(reg.pagoPendiente||{})[c]?"Sí":"",coments[c]||""]);
  });
  resRows.push(["","TOTAL","",sB,sD,sDe,sN,"",""]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resRows),"Resumen");

  // ── Hoja 2: Productos ──
  // Fix obs.3a: agregar columna Estado de entrega
  // Fix obs.3b: unidades/monto devueltos correctos (incluyendo devolución total = todas las unidades)
  const pRows=[["Ruta","Cliente","Estado","Pedido","Producto","Unid pedidas","Monto Q","Unid devueltas","Monto dev Q","Unid netas","Monto neto Q"]];
  const cltsP=[...clts].sort((a,b)=>{
    const ra=cMap[a]?.ruta||"ZZZ", rb=cMap[b]?.ruta||"ZZZ";
    return ra.localeCompare(rb);
  });
  cltsP.forEach(c=>{
    const ruta=cMap[c]?.ruta||"";
    const est=estadoEnt[c];
    const lbl=est==="verde"?"Entregado":est==="amarillo"?"Parcial":est==="rosado"?"Dev. total":"Pendiente";
    const esRosado = est==="rosado";
    Object.entries(cMap[c]?.pedidos||{}).forEach(([ped,pd])=>{
      pd.lineas.forEach(l=>{
        let du,dm;
        if(esRosado){
          // Devolución total: todas las unidades y monto del producto
          du=l.unidades; dm=l.monto;
        } else {
          const dv=devs.filter(d=>d.cliente===c&&d.pedido===ped&&d.producto===l.producto);
          du=dv.reduce((s,d)=>s+d.unidades,0);
          dm=dv.reduce((s,d)=>s+d.monto,0);
        }
        pRows.push([ruta,c,lbl,ped,l.producto,l.unidades,l.monto,du||0,dm||0,l.unidades-du,l.monto-dm]);
      });
    });
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pRows),"Productos");

  // ── Hoja 3: Devoluciones ──
  const dRows=[["Cliente","Estado","Pedido","Producto","Unidades","Monto Q","Codigo","Motivo"]];
  const MOTIVOS_MAP_EXP={"D01":"Cliente rechazó el pedido","D02":"Producto incorrecto","D03":"Sin dinero","D04":"Cerrado"};
  // Solo devs de clientes que existen en el clienteMap del día (filtrar contaminación de otros días)
  devs.filter(d=>clts.includes(d.cliente)).forEach(d=>{
    const est=estadoEnt[d.cliente];
    const lbl=est==="amarillo"?"Parcial":est==="rosado"?"Dev. total":"Dev. parcial";
    const motivoRosado = est==="rosado" ? (reg.motivosDevTotal?.[d.cliente]||{}) : null;
    const codigo = motivoRosado?.codigo || d.codigo || "D01";
    const descFinal = motivoRosado?.desc || d.desc || MOTIVOS_MAP_EXP[codigo] || codigo || "";
    dRows.push([d.cliente,lbl,d.pedido,d.producto,d.unidades,d.monto,codigo,descFinal]);
  });
  // Rosados sin devs registradas línea a línea (devolución total implícita)
  clts.forEach(c=>{
    if(estadoEnt[c]!=="rosado") return;
    const yaRegistrado = devs.some(d=>d.cliente===c);
    if(yaRegistrado) return;
    const motivo=reg.motivosDevTotal?.[c]||{};
    const codigoMot = motivo.codigo||"D01";
    const descMot = motivo.desc || MOTIVOS_MAP_EXP[codigoMot] || "Devolución total";
    Object.entries(cMap[c]?.pedidos||{}).forEach(([ped,pd])=>{
      pd.lineas.forEach(l=>{
        dRows.push([c,"Dev. total",ped,l.producto,l.unidades,l.monto,codigoMot,descMot]);
      });
    });
  });
  if(dRows.length>1) XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dRows),"Devoluciones");

  // ── Hoja 4: Cuadre Final ──
  const tB=[1,5,10,20,50,100,200].reduce((s,b)=>s+b*(parseFloat(billetes[b])||0),0);
  const mon=parseFloat(reg.monedas)||0,tEf=tB+mon;
  const tDep=parseFloat(reg.deposito)||0,tTra=parseFloat(reg.transferencia)||0;
  const tGas=gastos.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const tGasDeCuenta=gastos.reduce((s,g)=>g.deCuenta?(s+(parseFloat(g.monto)||0)):s,0);
  const tGasBodega=tGas-tGasDeCuenta;
  const tPag=tEf+tDep+tTra;
  // Clientes no confirmados: su bruto NO se cobra, se descuenta del neto igual que la app
  const tNoCobrado=clts.filter(c=>!estadoEnt[c]).reduce((acc,c)=>{
    let m=0; Object.values(cMap[c]?.pedidos||{}).filter(p=>!/^pre$/i.test(p.estPed||"")).forEach(p=>p.lineas.filter(l=>!/^pre$/i.test(l.estPed||"")).forEach(l=>{m+=l.monto;}));
    return acc+m;
  },0);
  // Total Neto cobrable = bruto - devs - descuentos - no confirmados (igual que la app)
  const sNeto=sB-sD-sDe-tNoCobrado;
  // Diferencia = (pagos + gastosDeCuenta) - netoACobrar (mismo signo que la app)
  const nRec=tPag-tGasDeCuenta;
  const dif=(tPag+tGasDeCuenta)-sNeto;
  const cuadreRows=[
    ["CUADRE FINAL - "+(reg.fecha||"")],[],["BILLETES","Cantidad","Total Q"],
    ...[1,5,10,20,50,100,200].map(b=>{const c=parseFloat(billetes[b])||0;return c>0?["Q"+b,c,b*c]:null;}).filter(Boolean),
    ["Subtotal billetes","",tB],["Monedas","",mon],["Total efectivo","",tEf],
    [],[" OTROS PAGOS","",""],["Deposito bancario","",tDep],["Transferencia","",tTra],
    [],[" GASTOS DE RUTA","Descripcion","Monto Q","De cuenta (✓=si)"],
    ...gastos.filter(g=>parseFloat(g.monto)).map(g=>[g.comentario||"",g.desc||"",parseFloat(g.monto),g.deCuenta?"✓":"—"]),
    ["Gastos de ruta (bodega)","",tGasBodega],["Gastos de ruta (de cuenta)","",tGasDeCuenta],["Total gastos","",tGas],
    [],[" RESUMEN","",""],
    ["Total a entregar (bruto)","",sB],["(-) Devoluciones","",-sD],["(-) Descuentos","",-sDe],["(-) Ent. no confirmadas","",-tNoCobrado],["Total neto a cobrar","",sNeto],
    [],[" PAGOS RECIBIDOS","",""],
    ["Total pagos recibidos","",tPag],["Gastos de ruta de cuenta (sumados)","",tGasDeCuenta],["Neto recibido (sin gastos de cuenta)","",nRec],
    [],[Math.abs(dif)<0.01?"✓ CUADRADO":dif>0?"SOBRANTE":"FALTANTE","DIFERENCIA",dif],
  ];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cuadreRows),"Cuadre Final");
  XLSX.writeFile(wb,"Liquidacion_"+(reg.fecha||"").replace(/[/]/g,"-")+".xlsx");
}

// ── Exportar múltiples días en un solo Excel ──
async function exportarExcelMultiple(fechas) {
  if(!fechas || fechas.length===0) return;
  // Si solo es un día, usar la función normal
  if(fechas.length===1){
    const reg=state.historialData[fechas[0]];
    if(reg) exportarExcel(reg);
    return;
  }
  const wb=XLSX.utils.book_new();
  // Hoja resumen global (todos los días)
  const globalRows=[["Fecha","Repartidor","Total Bruto Q","Devoluciones Q","Descuentos Q","Total Neto Q"]];
  let gB=0,gD=0,gDe=0,gN=0;

  fechas.sort().forEach(fecha=>{
    const reg=state.historialData[fecha];
    if(!reg) return;
    const devs=reg.devoluciones||[];
    const descs=reg.descuentos||{};
    const estadoEnt=reg.estadoEntrega||reg.entregados||{};
    const cMap=reg.clienteMap||{};
    const clts=[...new Set([...Object.keys(estadoEnt),...Object.keys(cMap)])].filter(Boolean)
      .filter(c=>{ const ps=Object.values(cMap[c]?.pedidos||{}); return !(ps.length>0&&ps.every(p=>/^pre$/i.test(p.estPed||""))); });
    let sB=0,sD=0,sDe=0,sN=0;
    clts.forEach(c=>{
      let bruto=0; Object.values(cMap[c]?.pedidos||{}).forEach(p=>p.lineas.forEach(l=>{bruto+=l.monto;}));
      const est=estadoEnt[c];
      const dv=est==="rosado"?bruto:devs.filter(d=>d.cliente===c).reduce((s,d)=>s+d.monto,0);
      const dc=est==="rosado"?0:(parseFloat(descs[c])||0);
      sB+=bruto; sD+=dv; sDe+=dc; sN+=bruto-dv-dc;
    });
    gB+=sB; gD+=sD; gDe+=sDe; gN+=sN;
    globalRows.push([fecha,reg.repartidor||"",sB,sD,sDe,sN]);

    // Hoja individual de resumen por cliente para este día
    const sheetName=fecha.replace(/-/g,"").slice(2); // ej: "250501"
    const resRows=[["Ruta","Cliente","Estado","Total bruto Q","Devoluciones Q","Descuento Q","Total neto Q"]];
    clts.sort((a,b)=>{const ra=cMap[a]?.ruta||"ZZZ",rb=cMap[b]?.ruta||"ZZZ";return ra.localeCompare(rb);}).forEach(c=>{
      const ruta=cMap[c]?.ruta||"";
      const est=estadoEnt[c];
      const lbl=est==="verde"?"Entregado":est==="amarillo"?"Parcial":est==="rosado"?"Dev. total":"Pendiente";
      let bruto=0; Object.values(cMap[c]?.pedidos||{}).forEach(p=>p.lineas.forEach(l=>{bruto+=l.monto;}));
      const dv=est==="rosado"?bruto:devs.filter(d=>d.cliente===c).reduce((s,d)=>s+d.monto,0);
      const dc=est==="rosado"?0:(parseFloat(descs[c])||0);
      resRows.push([ruta,c,lbl,bruto,dv>0?dv:0,dc>0?dc:0,bruto-dv-dc]);
    });
    resRows.push(["","TOTAL","",sB,sD,sDe,sN]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resRows),sheetName);
  });

  globalRows.push(["","TOTAL",gB,gD,gDe,gN]);
  // Insertar hoja resumen al inicio
  const wbResumen=XLSX.utils.aoa_to_sheet(globalRows);
  wb.SheetNames.unshift("Resumen General");
  wb.Sheets["Resumen General"]=wbResumen;

  const desde=fechas[0].replace(/-/g,"");
  const hasta=fechas[fechas.length-1].replace(/-/g,"");
  XLSX.writeFile(wb,`Liquidaciones_${desde}_${hasta}.xlsx`);
}

function guardarDev() {
  if(!state.dvPedido||!state.dvProducto){setState({dvError:"Selecciona pedido y producto."});return;}
  const u=parseFloat(state.dvUnidades)||0,m=parseFloat(state.dvMonto)||0;
  if(u<=0||m<=0){setState({dvError:"Ingresa unidades válidas."});return;}
  const prod=prodsDisp(state.clienteDetalle,state.dvPedido).find(p=>p.producto===state.dvProducto);
  if(!prod){setState({dvError:"Producto no disponible."});return;}
  if(u>prod.dispU){setState({dvError:`Máximo: ${prod.dispU} unidades.`});return;}
  if(m>prod.dispM+0.01){setState({dvError:`Máximo: ${fQ(prod.dispM)}.`});return;}
  const motivo=MOTIVOS.find(x=>x.codigo===state.dvCodigo);
  setState({
    devoluciones:[...state.devoluciones,{id:Date.now(),cliente:state.clienteDetalle,pedido:state.dvPedido,producto:state.dvProducto,unidades:u,monto:m,codigo:state.dvCodigo,desc:motivo.desc}],
    dvPedido:"",dvProducto:"",dvUnidades:"",dvMonto:"",dvCodigo:"D01",dvError:"",showDvForm:false
  });
}

function guardarDevPopup() {
  const p = state.dvPopup;
  if(!p) return;
  const u = parseFloat(p.unidades)||0;
  if(u<=0){ setState({dvPopup:{...p,error:"Ingresa una cantidad válida."}}); return; }
  if(u>p.dispU){ setState({dvPopup:{...p,error:`Máximo: ${fN(p.dispU)} unidades.`}}); return; }
  const pu = p.dispM / p.dispU;
  const m = parseFloat((u * pu).toFixed(2));
  // Quitar dev temporal previa del mismo producto y agregar la nueva
  const sinEste = state.dvTemporal.filter(d=>!(d.cliente===p.cliente&&d.pedido===p.pedido&&d.producto===p.producto));
  setState({
    dvTemporal:[...sinEste,{id:Date.now(),cliente:p.cliente,pedido:p.pedido,producto:p.producto,unidades:u,monto:m,codigo:"",desc:""}],
    dvPopup:null
  });
}

function aplicarEditPrecio() {
  const {cliente, pedido, producto, valor} = state.editPrecio || {};
  const pu = parseFloat(valor);
  if(!cliente || !pedido || !producto || isNaN(pu) || pu < 0) {
    setState({editPrecio: null}); return;
  }
  const newMap = JSON.parse(JSON.stringify(state.clienteMap));
  const lineas = newMap[cliente]?.pedidos?.[pedido]?.lineas;
  if(!lineas) { setState({editPrecio: null}); return; }
  const linea = lineas.find(l => l.producto === producto);
  if(!linea) { setState({editPrecio: null}); return; }
  linea.monto = parseFloat((pu * linea.unidades).toFixed(2));
  setState({clienteMap: newMap, editPrecio: null});
  showToast("✏️ Precio actualizado", "#2563eb");
}

function aplicarEditCantidad() {
  const {cliente, pedido, producto, valor} = state.editCantidad || {};
  const cant = parseFloat(valor);
  if(!cliente || !pedido || !producto || isNaN(cant) || cant < 0) {
    setState({editCantidad: null}); return;
  }
  const newMap = JSON.parse(JSON.stringify(state.clienteMap));
  const lineas = newMap[cliente]?.pedidos?.[pedido]?.lineas;
  if(!lineas) { setState({editCantidad: null}); return; }

  setState({clienteMap: newMap, editCantidad: null});
  showToast("✏️ Cantidad actualizada", "#2563eb");
}

function showToast(msg, color) {
  const t=document.createElement("div");
  t.style.cssText=`position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${color||"#27ae60"};color:#fff;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:700;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity 0.5s;`;

}

// ── Modal propio (reemplaza confirm/alert nativos) ──
function showModal({titulo="", mensaje="", tipo="confirm", btnAceptar="Aceptar", btnCancelar="Cancelar", colorAceptar=null, colorCancelar=null, onAceptar=null, onCancelar=null}={}) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;font-family:sans-serif;";
  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:14px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);";
  if(titulo) {
    const t = document.createElement("h3");
    t.style.cssText = "margin:0 0 10px;color:#1e3a5f;font-size:16px;font-weight:700;";
    t.textContent = titulo;
    box.appendChild(t);
  }
  const msg = document.createElement("p");
  msg.style.cssText = "margin:0 0 22px;font-size:14px;color:#444;line-height:1.5;white-space:pre-line;";
  msg.textContent = mensaje;
  box.appendChild(msg);
  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:10px;";
  const close = (cb) => { overlay.remove(); if(cb) cb(); };
  if(tipo === "confirm") {
    const bCanc = document.createElement("button");
    bCanc.textContent = btnCancelar;
    bCanc.style.cssText = `flex:1;background:${colorCancelar||"#f0f0f0"};color:${colorCancelar?"#fff":"#555"};border:none;border-radius:8px;padding:12px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:sans-serif;`;
    bCanc.onclick = () => close(onCancelar);
    btns.appendChild(bCanc);
  }
  const bAcep = document.createElement("button");
  bAcep.textContent = btnAceptar;
  bAcep.style.cssText = `flex:1;background:${colorAceptar||"#1e3a5f"};color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;`;
  bAcep.onclick = () => close(onAceptar);
  btns.appendChild(bAcep);
  box.appendChild(btns);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  // Foco en el botón principal
  setTimeout(() => bAcep.focus(), 50);
}

// ── Mover producto entre clientes ──
function ejecutarMoverProducto() {
  const {moverOrigenCliente, moverOrigenPedido, moverProductoSel, moverDestinoCliente, moverDestinoPedido} = state;
  if(!moverOrigenCliente||!moverOrigenPedido||!moverProductoSel||!moverDestinoCliente||!moverDestinoPedido){
    setState({moverError:"Completa todos los campos."}); return;
  }
  if(moverOrigenCliente===moverDestinoCliente && moverOrigenPedido===moverDestinoPedido){
    setState({moverError:"El origen y destino son iguales."}); return;
  }
  const newMap = JSON.parse(JSON.stringify(state.clienteMap));
  const lineasOrigen = newMap[moverOrigenCliente]?.pedidos?.[moverOrigenPedido]?.lineas;
  if(!lineasOrigen){setState({moverError:"Pedido origen no encontrado."}); return;}
  const idx = lineasOrigen.findIndex(l=>l.producto===moverProductoSel);
  if(idx===-1){setState({moverError:"Producto no encontrado en origen."}); return;}
  const [linea] = lineasOrigen.splice(idx,1);
  if(!newMap[moverDestinoCliente]){setState({moverError:"Cliente destino no encontrado."}); return;}
  if(!newMap[moverDestinoCliente].pedidos[moverDestinoPedido]){
    newMap[moverDestinoCliente].pedidos[moverDestinoPedido]={lineas:[],estPed:""};
  }
  newMap[moverDestinoCliente].pedidos[moverDestinoPedido].lineas.push(linea);
  setState({clienteMap:newMap, showMoverProd:false, moverOrigenCliente:"", moverOrigenPedido:"", moverProductoSel:"", moverDestinoCliente:"", moverDestinoPedido:"", moverError:""});
  showToast("Producto movido correctamente","#1e3a5f");
}

// ── Actualizar resumen sin re-render completo ──
function actualizarResumen() {
  const resDiv = document.getElementById("resumen-cuadre");
  const totalBilletes2 = [1,5,10,20,50,100,200].reduce((s,b)=>s+b*(parseFloat(state.billetes[b])||0),0);
  const totalMonedas2 = parseFloat(state.monedas)||0;

  const totalDeposito2 = parseFloat(state.deposito)||0;
  const totalTransferencia2 = parseFloat(state.transferencia)||0;
  const totalGastosDeCuenta2 = state.gastosDetalle.reduce((s,g)=>g.deCuenta?(s+(parseFloat(g.monto)||0)):s,0);
  const totalGastosBodega2 = state.gastosDetalle.reduce((s,g)=>!g.deCuenta?(s+(parseFloat(g.monto)||0)):s,0);
  const totalGastos2 = totalGastosDeCuenta2 + totalGastosBodega2;
  const totalPagos2 = totalEfectivo2 + totalDeposito2 + totalTransferencia2;

  // Total a Entregar: bruto de clientes entregables (excluir presupuestos)
  const totalAEntregar = Object.keys(state.clienteMap).reduce((acc,c)=>{
    if(esClientePre(c)) return acc;
    let m=0; Object.values(state.clienteMap[c].pedidos||{}).filter(p=>!esPedPre(p)).forEach(p=>p.lineas.forEach(l=>{m+=l.monto;}));
    return acc + m;
  },0);
  // Devoluciones: parciales + bruto de rosados (excluir presupuestos)
  const totalDevCuadre = Object.keys(state.clienteMap).reduce((acc,c)=>{
    if(esClientePre(c)) return acc;
    if(state.estadoEntrega[c]==="rosado"){
      let m=0; Object.values(state.clienteMap[c].pedidos||{}).forEach(p=>p.lineas.forEach(l=>{m+=l.monto;}));
      return acc + m;
    }
    return acc + state.devoluciones.filter(d=>d.cliente===c).reduce((s,d)=>s+d.monto,0);
  },0);
  // Descuentos: solo confirmados verde+amarillo (excluir presupuestos)
  const totalDescCuadre = Object.keys(state.clienteMap).reduce((acc,c)=>{
    if(esClientePre(c)) return acc;
    if(!state.estadoEntrega[c]||state.estadoEntrega[c]==="rosado") return acc;
    return acc + (parseFloat(state.descuentos[c])||0);
  },0);
  // Entregas no confirmadas: monto bruto de clientes sin estado (excluir presupuestos)
  const totalNoConfirmado = Object.keys(state.clienteMap).reduce((acc,c)=>{
    if(esClientePre(c)) return acc;
    if(state.estadoEntrega[c]) return acc; // ya tiene estado
    let m=0; Object.values(state.clienteMap[c].pedidos||{}).filter(p=>!esPedPre(p)).forEach(p=>p.lineas.filter(l=>!/^pre$/i.test(l.estPed||"")).forEach(l=>{m+=l.monto;}));
    return acc + m;
  },0);
  // Total Neto: Total a Entregar - Devoluciones - Descuentos - No confirmadas
  const totalNetoCuadre = totalAEntregar - totalDevCuadre - totalDescCuadre - totalNoConfirmado;

  const diferencia2 = (totalPagos2 + totalGastosDeCuenta2) - totalNetoCuadre;
  resDiv.innerHTML = "";
  [
    {label:"Total a Entregar", val:fQ(totalAEntregar), color:"#1e3a5f", bold:true},
    {label:"(-) Devoluciones", val:`-${fQ(totalDevCuadre)}`, color:"#c0392b"},
    {label:"(-) Descuentos", val:`-${fQ(totalDescCuadre)}`, color:"#e67e22"},
    {label:"Ent. no confirmadas", val:totalNoConfirmado>0?`-${fQ(totalNoConfirmado)}`:"Q 0.00", color:"#e67e22"},
    {label:"Total Neto", val:fQ(totalNetoCuadre), color:"#1e3a5f", bold:true, sep:true},
    {label:"Efectivo", val:fQ(totalEfectivo2), color:"#333"},
    {label:"Depósito", val:fQ(totalDeposito2), color:"#333"},
    {label:"Transferencia", val:fQ(totalTransferencia2), color:"#333"},
    {label:"Total recibido", val:fQ(totalPagos2), color:"#2563eb", bold:true},

const s = (styles) => Object.entries(styles).map(([k,v])=>`${k.replace(/([A-Z])/g,'-$1').toLowerCase()}:${v}`).join(';');

function el(tag, attrs={}, ...children) {
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") e.style.cssText=s(v);
    else if(k.startsWith("on")) e[k.toLowerCase()]=v;
    else if(k==="checked") e.checked=v;
    else if(k==="disabled") e.disabled=v;
    else if(k==="autoFocus") { if(v) setTimeout(()=>e.focus(),50); }
    else e.setAttribute(k,v);
  });
  children.flat().forEach(child=>{
    if(child==null||child===false) return;
    e.appendChild(typeof child==="string"?document.createTextNode(child):child);
  });
  return e;
}

function renderHistorial() {
  const esAdmin = state.esAdmin;

  inner.appendChild(hdr);

  if(esAdmin) {
    // ── Vista admin: primero lista de repartidores ──
    if(!state.historialRepSelec) {
      // Extraer todos los repartidores únicos del historial
      const repsSet = new Set();
      Object.values(data).forEach(dia => { if(dia.repartidor) repsSet.add(dia.repartidor); });
      // También incluir repartidores de la lista aunque no tengan historial aún
      (state.listaRepartidores||[]).forEach(r=>{ const n=typeof r==="string"?r:(r.nombre||""); if(n) repsSet.add(n); });
      const reps = [...repsSet].sort();

      // Contar fechas sin repartidor asignado
      const sinAsignar = Object.entries(data).filter(([,v])=>!v.repartidor);

      if(reps.length===0 && sinAsignar.length===0){
        inner.appendChild(el("div",{style:{background:"#fff",borderRadius:"12px",padding:"48px",textAlign:"center",color:"#aaa"}},"No hay liquidaciones registradas aún."));
        return wrap;
      }
      inner.appendChild(el("p",{style:{fontSize:"13px",fontWeight:"600",color:"#555",margin:"0 0 12px"}},"Selecciona un repartidor:"));

      // Cards de repartidores conocidos
      reps.forEach(rep => {
        const fechasRep = Object.entries(data).filter(([,v])=>v.repartidor===rep).length;
        const card = el("div",{style:{background:"#fff",borderRadius:"12px",padding:"16px 20px",marginBottom:"10px",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"},
          onClick:()=>setState({historialRepSelec:rep})});
        const left = el("div");
        left.appendChild(el("div",{style:{fontWeight:"700",fontSize:"15px",color:"#1e3a5f"}},rep));
        left.appendChild(el("div",{style:{fontSize:"12px",color:"#aaa",marginTop:"2px"}},fechasRep>0?fechasRep+" liquidación"+(fechasRep>1?"es":"")+" registrada"+(fechasRep>1?"s":""):"Sin liquidaciones aún"));
        card.appendChild(left);
        card.appendChild(el("span",{style:{fontSize:"20px",color:"#ccc"}},"›"));
        inner.appendChild(card);
      });

      // Card "Sin asignar" para liquidaciones sin repartidor
      if(sinAsignar.length>0){
        const cardSin = el("div",{style:{background:"#fff8e1",border:"1px solid #ffe082",borderRadius:"12px",padding:"16px 20px",marginBottom:"10px",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"},
          onClick:()=>setState({historialRepSelec:"__sin_asignar__"})});
        const leftSin = el("div");
        leftSin.appendChild(el("div",{style:{fontWeight:"700",fontSize:"15px",color:"#795548"}},"⚠️ Sin asignar"));
        leftSin.appendChild(el("div",{style:{fontSize:"12px",color:"#aaa",marginTop:"2px"}},sinAsignar.length+" liquidación"+(sinAsignar.length>1?"es":"")+" sin repartidor"));
        cardSin.appendChild(leftSin);
        cardSin.appendChild(el("span",{style:{fontSize:"20px",color:"#ccc"}},"›"));
        inner.appendChild(cardSin);
      }
      return wrap;
    }

    // ── Vista admin: fechas del repartidor seleccionado (o sin asignar) ──
    if(state.historialRepSelec && !state.fechaSelec) {
      const repSelec = state.historialRepSelec;
      const esSinAsignar = repSelec === "__sin_asignar__";
      const fechasRep = Object.entries(data)
        .filter(([,v])=> esSinAsignar ? !v.repartidor : v.repartidor===repSelec)
        .map(([f])=>f).sort().reverse();

      const hdrRep = el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}});
      hdrRep.appendChild(el("button",{style:{background:"#f0f4f8",border:"none",borderRadius:"8px",padding:"8px 12px",cursor:"pointer",fontSize:"13px",color:"#555"},
        onClick:()=>setState({historialRepSelec:"",fechaSelec:"",historialSeleccionados:{}})},"← Repartidores"));
      hdrRep.appendChild(el("h2",{style:{margin:"0",fontSize:"16px",color:esSinAsignar?"#795548":"#1e3a5f"}},
        esSinAsignar?"⚠️ Sin asignar":repSelec));
      inner.appendChild(hdrRep);

      if(esSinAsignar && fechasRep.length>0){
        const nota=el("div",{style:{background:"#fff8e1",border:"1px solid #ffe082",borderRadius:"10px",padding:"10px 14px",fontSize:"12px",color:"#795548",marginBottom:"14px"}});
        nota.textContent="Estas liquidaciones no tienen repartidor asignado. Haz click en un día para asignar repartidor o ver la liquidación.";
        inner.appendChild(nota);
      }

      if(fechasRep.length===0){
        inner.appendChild(el("div",{style:{background:"#fff",borderRadius:"12px",padding:"32px",textAlign:"center",color:"#aaa"}},"Este repartidor no tiene liquidaciones registradas."));
        return wrap;
      }

      // ── Calendario visual ──
      const fechasSet = new Set(fechasRep);

      // Barra de descarga (solo admin no-sinAsignar)
      if(!esSinAsignar){
        const selCount = Object.values(state.historialSeleccionados).filter(Boolean).length;
        const barraMulti = el("div",{style:{background:"#fff",borderRadius:"10px",padding:"12px 16px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}});
        const lblSel = el("span",{style:{fontSize:"13px",color:"#555",flex:"1"}},
          selCount > 0 ? `${selCount} día${selCount>1?"s":""} seleccionado${selCount>1?"s":""}` : "Click para ver · Arrastrar para seleccionar");
        barraMulti.appendChild(lblSel);
        if(selCount > 0){
          const btnDescMulti = el("button",{style:{background:"#27ae60",color:"#fff",border:"none",borderRadius:"8px",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"700",flexShrink:"0"},
            onClick:()=>{
              const fechasSel = Object.entries(state.historialSeleccionados).filter(([,v])=>v).map(([f])=>f).sort();
              if(fechasSel.length===0){ showToast("Selecciona al menos un día","#e67e22"); return; }
              exportarExcelMultiple(fechasSel);
            }},`📊 Descargar Excel (${selCount})`);
          barraMulti.appendChild(btnDescMulti);
          const btnLimpM = el("button",{style:{background:"#eee",color:"#555",border:"none",borderRadius:"8px",padding:"8px 12px",cursor:"pointer",fontSize:"13px",fontWeight:"700",flexShrink:"0"},
            onClick:()=>setState({historialSeleccionados:{}})}, "✕");
          barraMulti.appendChild(btnLimpM);
        }
        inner.appendChild(barraMulti);
      }

      // Agrupar en meses (rango continuo entre min y max)
      if(fechasRep.length > 0){
        const minF = fechasRep[fechasRep.length-1]; // sorted desc, so last = oldest
        const maxF = fechasRep[0];
        const [minY,minM] = minF.split("-").map(Number);
        const [maxY,maxM] = maxF.split("-").map(Number);
        const meses=[];
        let cy=minY,cm=minM;
        while(cy<maxY||(cy===maxY&&cm<=maxM)){ meses.push({y:cy,m:cm}); cm++; if(cm>12){cm=1;cy++;} }

        const MESES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        const DIAS_N=["L","M","X","J","V","S","D"];

        const calGrid = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"14px",marginBottom:"14px"}});

        // Estado drag para selección por rango (solo admin no-sinAsignar)
        let dragActivo=false, dragFechaInicio=null;

        meses.forEach(({y,m})=>{
          const mesBox = el("div",{style:{background:"#fff",borderRadius:"14px",padding:"14px 10px",boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}});

          // Cabecera mes + checkbox "todo el mes"
          const mesHdr = el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",marginBottom:"8px"}});
          const mesNomEl = el("div",{style:{textAlign:"center",fontWeight:"700",fontSize:"12px",color:"#1e3a5f"}});
          mesNomEl.appendChild(document.createTextNode(MESES_N[m-1]));
          mesNomEl.appendChild(el("span",{style:{fontWeight:"400",color:"#aaa",fontSize:"11px"}},` ${y}`));
          mesHdr.appendChild(mesNomEl);

          if(!esSinAsignar){
            // Calcular días del mes que tienen datos
            const diasDelMes=[];
            const diasMesTot=new Date(y,m,0).getDate();
            for(let dd=1;dd<=diasMesTot;dd++){
              const fk=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
              if(fechasSet.has(fk)) diasDelMes.push(fk);
            }
            if(diasDelMes.length>0){
              const todosSelec = diasDelMes.every(f=>!!state.historialSeleccionados[f]);
              const chkTodo = el("input",{type:"checkbox"});
              chkTodo.checked = todosSelec;
              chkTodo.title = todosSelec?"Deseleccionar mes":"Seleccionar todo el mes";
              chkTodo.style.cssText="cursor:pointer;width:13px;height:13px;accent-color:#1e3a5f;flex-shrink:0;";
              chkTodo.addEventListener("change",()=>{
                const nuevo={...state.historialSeleccionados};
                if(chkTodo.checked){ diasDelMes.forEach(f=>nuevo[f]=true); }
                else { diasDelMes.forEach(f=>delete nuevo[f]); }
                setState({historialSeleccionados:nuevo});
              });
              mesHdr.appendChild(chkTodo);
            }
          }
          mesBox.appendChild(mesHdr);

          const diasHdr = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"1px",marginBottom:"3px"}});
          DIAS_N.forEach(d=>{ diasHdr.appendChild(el("div",{style:{textAlign:"center",fontSize:"9px",fontWeight:"700",color:"#bbb",padding:"1px 0"}},d)); });
          mesBox.appendChild(diasHdr);
          const diasGrid = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",userSelect:"none"}});
          const offset = (new Date(y,m-1,1).getDay()+6)%7;
          const diasMes = new Date(y,m,0).getDate();
          for(let i=0;i<offset;i++) diasGrid.appendChild(el("div",{}));
          for(let d=1;d<=diasMes;d++){
            const fKey=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            const tieneDatos = fechasSet.has(fKey);
            const seleccionado = !!state.historialSeleccionados[fKey];
            // Wrapper relativo para contener el círculo y el botón ✏️
            const celdaWrap = el("div",{style:{position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}});
            const diaEl = el("div",{style:{
              textAlign:"center", fontSize:"11px", fontWeight: tieneDatos?"700":"400",
              borderRadius:"50%", width:"24px", height:"24px", lineHeight:"24px",
              margin:"0 auto", cursor: tieneDatos?"pointer":"default",
              background: seleccionado?"#1e3a5f": tieneDatos?"#dbeeff":"transparent",
              color: seleccionado?"#fff": tieneDatos?"#1e3a5f":"#ccc",
              border: tieneDatos&&!seleccionado?"1.5px solid #a8cff0":"1.5px solid transparent",
              transition:"all 0.12s"
            }},String(d));
            if(tieneDatos){
              if(esSinAsignar){
                diaEl.addEventListener("click",()=>abrirModalAsignarRepartidor(fKey));
                diaEl.title="Click para asignar repartidor";
              } else {
                // Click simple: abrir liquidación
                diaEl.addEventListener("click",(e)=>{
                  if(dragActivo) return; // si fue drag, no abrir
                  if(e.target._esBtnFecha) return; // click en botón ✏️
                  cargarFechaHistorial(fKey);
                });
                // Drag para selección de rango
                diaEl.addEventListener("mousedown",(e)=>{
                  e.preventDefault();
                  dragActivo=false;
                  dragFechaInicio=fKey;
                  const onMove=(ev)=>{
                    const over=document.elementFromPoint(ev.clientX,ev.clientY);
                    if(over && over._fKey && over._fKey!==fKey) dragActivo=true;
                    if(dragActivo && over && over._fKey){
                      const todasFechas=[...fechasSet].sort();
                      const i1=todasFechas.indexOf(dragFechaInicio);
                      const i2=todasFechas.indexOf(over._fKey);
                      if(i1<0||i2<0) return;
                      const [ini,fin]=[Math.min(i1,i2),Math.max(i1,i2)];
                      const rango=todasFechas.slice(ini,fin+1);
                      const nuevo={...state.historialSeleccionados};
                      rango.forEach(f=>nuevo[f]=true);
                      setState({historialSeleccionados:nuevo});
                    }
                  };
                  const onUp=()=>{
                    document.removeEventListener("mousemove",onMove);
                    document.removeEventListener("mouseup",onUp);
                    setTimeout(()=>{dragActivo=false;},50);
                  };
                  document.addEventListener("mousemove",onMove);
                  document.addEventListener("mouseup",onUp);
                });
                // Touch drag para móvil
                diaEl.addEventListener("touchstart",(e)=>{
                  dragActivo=false; dragFechaInicio=fKey;
                  const onTMove=(ev)=>{
                    const t=ev.touches[0];
                    const over=document.elementFromPoint(t.clientX,t.clientY);
                    if(over&&over._fKey&&over._fKey!==fKey) dragActivo=true;
                    if(dragActivo&&over&&over._fKey){
                      const todasFechas=[...fechasSet].sort();
                      const i1=todasFechas.indexOf(dragFechaInicio);
                      const i2=todasFechas.indexOf(over._fKey);
                      if(i1<0||i2<0) return;
                      const [ini,fin]=[Math.min(i1,i2),Math.max(i1,i2)];
                      const rango=todasFechas.slice(ini,fin+1);
                      const nuevo={...state.historialSeleccionados};
                      rango.forEach(f=>nuevo[f]=true);
                      setState({historialSeleccionados:nuevo});
                    }
                  };
                  const onTUp=()=>{
                    document.removeEventListener("touchmove",onTMove);
                    document.removeEventListener("touchend",onTUp);
                    setTimeout(()=>{dragActivo=false;},50);
                  };
                  document.addEventListener("touchmove",onTMove,{passive:true});
                  document.addEventListener("touchend",onTUp);
                },{passive:true});
                diaEl.title="Click para ver | Arrastrar para seleccionar rango";
              }
            }
            diaEl._fKey = tieneDatos ? fKey : null;
            celdaWrap._fKey = tieneDatos ? fKey : null;
            celdaWrap.appendChild(diaEl);
            // Botón ✏️ para cambiar fecha (solo admin, solo días con datos)
            if(tieneDatos){
              const btnFecha = document.createElement("button");
              btnFecha._esBtnFecha = true;
              btnFecha.textContent = "✏️";
              btnFecha.title = "Cambiar fecha de esta liquidación";
              btnFecha.style.cssText = "position:absolute;top:-8px;right:-8px;background:#fff;border:1px solid #a8cff0;border-radius:50%;width:16px;height:16px;font-size:8px;line-height:16px;text-align:center;cursor:pointer;padding:0;display:none;box-shadow:0 1px 4px rgba(0,0,0,0.18);z-index:2;";
              btnFecha.addEventListener("click",(e)=>{ e.stopPropagation(); abrirModalCambiarFecha(fKey); });
              celdaWrap.appendChild(btnFecha);
              // Mostrar/ocultar botón con hover

              celdaWrap.addEventListener("mouseleave",()=>{ btnFecha.style.display="none"; });

            diasGrid.appendChild(celdaWrap);
          }
          mesBox.appendChild(diasGrid);
          calGrid.appendChild(mesBox);
        });
        inner.appendChild(calGrid);
      }
      return wrap;
    }
  } else {
    // ── Vista repartidor: calendario visual ──

      ? (typeof state.repartidorVinculado==="string"?state.repartidorVinculado:(state.repartidorVinculado.nombre||"")) : "");
    const fechasRep = Object.entries(data)
      .filter(([,v])=>!repNombre || v.repartidor===repNombre)
      .map(([f])=>f).sort().reverse();

    if(fechasRep.length===0){
      inner.appendChild(el("div",{style:{background:"#fff",borderRadius:"12px",padding:"48px",textAlign:"center",color:"#aaa"}},"No tienes liquidaciones registradas aún."));
      return wrap;
    }

    // Barra de descarga repartidor
    const selCountR = Object.values(state.historialSeleccionados).filter(Boolean).length;
    const barraR = el("div",{style:{background:"#fff",borderRadius:"10px",padding:"12px 16px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}});
    const lblSelR = el("span",{style:{fontSize:"13px",color:"#555",flex:"1"}},
      selCountR > 0 ? `${selCountR} día${selCountR>1?"s":""} seleccionado${selCountR>1?"s":""}` : "Click para ver · Arrastrar para seleccionar");
    barraR.appendChild(lblSelR);
    if(selCountR > 0){
      const btnDescR = el("button",{style:{background:"#27ae60",color:"#fff",border:"none",borderRadius:"8px",padding:"8px 16px",cursor:"pointer",fontSize:"13px",fontWeight:"700",flexShrink:"0"},
        onClick:()=>{
          const fechasSel = Object.entries(state.historialSeleccionados).filter(([,v])=>v).map(([f])=>f).sort();
          if(fechasSel.length===0){ showToast("Selecciona al menos un día","#e67e22"); return; }
          exportarExcelMultiple(fechasSel);
        }},`📊 Descargar Excel (${selCountR})`);
      barraR.appendChild(btnDescR);
      // Botón limpiar selección
      const btnLimpR = el("button",{style:{background:"#eee",color:"#555",border:"none",borderRadius:"8px",padding:"8px 12px",cursor:"pointer",fontSize:"13px",fontWeight:"700",flexShrink:"0"},
        onClick:()=>setState({historialSeleccionados:{}})}, "✕");
      barraR.appendChild(btnLimpR);
    }
    inner.appendChild(barraR);

    // Calendario repartidor
    const fechasSetR = new Set(fechasRep);
    if(fechasRep.length > 0){
      const minFR = fechasRep[fechasRep.length-1];
      const maxFR = fechasRep[0];
      const [minYR,minMR] = minFR.split("-").map(Number);
      const [maxYR,maxMR] = maxFR.split("-").map(Number);
      const mesesR=[];
      let cyR=minYR,cmR=minMR;
      while(cyR<maxYR||(cyR===maxYR&&cmR<=maxMR)){ mesesR.push({y:cyR,m:cmR}); cmR++; if(cmR>12){cmR=1;cyR++;} }

      const MESES_NR=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      const DIAS_NR=["L","M","X","J","V","S","D"];

      let dragActivoR=false, dragFechaInicioR=null;

      const calGridR = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"14px",marginBottom:"14px"}});
      mesesR.forEach(({y,m})=>{
        const mesBox = el("div",{style:{background:"#fff",borderRadius:"14px",padding:"14px 10px",boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}});

        // Cabecera mes + checkbox "todo el mes"
        const mesHdrR = el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",marginBottom:"8px"}});
        const mesNomR = el("div",{style:{textAlign:"center",fontWeight:"700",fontSize:"12px",color:"#1e3a5f"}});
        mesNomR.appendChild(document.createTextNode(MESES_NR[m-1]));
        mesNomR.appendChild(el("span",{style:{fontWeight:"400",color:"#aaa",fontSize:"11px"}},` ${y}`));
        mesHdrR.appendChild(mesNomR);

        const diasDelMesR=[];
        const diasMesTotR=new Date(y,m,0).getDate();
        for(let dd=1;dd<=diasMesTotR;dd++){
          const fk=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
          if(fechasSetR.has(fk)) diasDelMesR.push(fk);
        }
        if(diasDelMesR.length>0){
          const todosSelecR = diasDelMesR.every(f=>!!state.historialSeleccionados[f]);
          const chkTodoR = el("input",{type:"checkbox"});
          chkTodoR.checked = todosSelecR;
          chkTodoR.title = todosSelecR?"Deseleccionar mes":"Seleccionar todo el mes";
          chkTodoR.style.cssText="cursor:pointer;width:13px;height:13px;accent-color:#1e3a5f;flex-shrink:0;";
          chkTodoR.addEventListener("change",()=>{
            const nuevo={...state.historialSeleccionados};
            if(chkTodoR.checked){ diasDelMesR.forEach(f=>nuevo[f]=true); }
            else { diasDelMesR.forEach(f=>delete nuevo[f]); }
            setState({historialSeleccionados:nuevo});
          });
          mesHdrR.appendChild(chkTodoR);
        }
        mesBox.appendChild(mesHdrR);

        const diasHdrR = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"1px",marginBottom:"3px"}});
        DIAS_NR.forEach(d=>{ diasHdrR.appendChild(el("div",{style:{textAlign:"center",fontSize:"9px",fontWeight:"700",color:"#bbb",padding:"1px 0"}},d)); });
        mesBox.appendChild(diasHdrR);
        const diasGridR = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",userSelect:"none"}});
        const offsetR = (new Date(y,m-1,1).getDay()+6)%7;
        const diasMesR = new Date(y,m,0).getDate();
        for(let i=0;i<offsetR;i++) diasGridR.appendChild(el("div",{}));
        for(let d=1;d<=diasMesR;d++){
          const fKey=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const tieneDatos = fechasSetR.has(fKey);
          const seleccionado = !!state.historialSeleccionados[fKey];
          const diaEl = el("div",{style:{
            textAlign:"center", fontSize:"11px", fontWeight: tieneDatos?"700":"400",
            borderRadius:"50%", width:"24px", height:"24px", lineHeight:"24px",
            margin:"0 auto", cursor: tieneDatos?"pointer":"default",
            background: seleccionado?"#1e3a5f": tieneDatos?"#dbeeff":"transparent",
            color: seleccionado?"#fff": tieneDatos?"#1e3a5f":"#ccc",
            border: tieneDatos&&!seleccionado?"1.5px solid #a8cff0":"1.5px solid transparent",
            transition:"all 0.12s"
          }},String(d));
          if(tieneDatos){
            // Click simple: abrir liquidación
            diaEl.addEventListener("click",()=>{
              if(dragActivoR) return;
              cargarFechaHistorial(fKey);
            });
            // Drag para selección rango (mouse)
            diaEl.addEventListener("mousedown",(e)=>{
              e.preventDefault();
              dragActivoR=false; dragFechaInicioR=fKey;
              const onMove=(ev)=>{
                const over=document.elementFromPoint(ev.clientX,ev.clientY);
                if(over&&over._fKey&&over._fKey!==fKey) dragActivoR=true;
                if(dragActivoR&&over&&over._fKey){
                  const todasF=[...fechasSetR].sort();
                  const i1=todasF.indexOf(dragFechaInicioR), i2=todasF.indexOf(over._fKey);
                  if(i1<0||i2<0) return;
                  const [ini,fin]=[Math.min(i1,i2),Math.max(i1,i2)];
                  const nuevo={...state.historialSeleccionados};
                  todasF.slice(ini,fin+1).forEach(f=>nuevo[f]=true);
                  setState({historialSeleccionados:nuevo});
                }
              };
              const onUp=()=>{ document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onUp); setTimeout(()=>{dragActivoR=false;},50); };
              document.addEventListener("mousemove",onMove);
              document.addEventListener("mouseup",onUp);
            });
            // Touch drag para móvil
            diaEl.addEventListener("touchstart",(e)=>{
              dragActivoR=false; dragFechaInicioR=fKey;
              const onTMove=(ev)=>{
                const t=ev.touches[0];
                const over=document.elementFromPoint(t.clientX,t.clientY);
                if(over&&over._fKey&&over._fKey!==fKey) dragActivoR=true;
                if(dragActivoR&&over&&over._fKey){
                  const todasF=[...fechasSetR].sort();
                  const i1=todasF.indexOf(dragFechaInicioR), i2=todasF.indexOf(over._fKey);
                  if(i1<0||i2<0) return;
                  const [ini,fin]=[Math.min(i1,i2),Math.max(i1,i2)];
                  const nuevo={...state.historialSeleccionados};
                  todasF.slice(ini,fin+1).forEach(f=>nuevo[f]=true);
                  setState({historialSeleccionados:nuevo});
                }
              };
              const onTUp=()=>{ document.removeEventListener("touchmove",onTMove); document.removeEventListener("touchend",onTUp); setTimeout(()=>{dragActivoR=false;},50); };
              document.addEventListener("touchmove",onTMove,{passive:true});
              document.addEventListener("touchend",onTUp);
            },{passive:true});
            diaEl.title="Click para ver · Arrastrar para seleccionar rango";
          }
          diaEl._fKey = tieneDatos ? fKey : null;
          diasGridR.appendChild(diaEl);
        }
        mesBox.appendChild(diasGridR);
        calGridR.appendChild(mesBox);
      });
      inner.appendChild(calGridR);
    }
  }
  return wrap;
}

function cargarFechaHistorial(fecha) {
  const reg=state.historialData[fecha];
  if(!reg) return;
  setState({
    fechaSelec:fecha, screen:"historialVista",
    clienteMap:reg.clienteMap||{}, fileName:reg.fileName||"", fecha:reg.fecha||fecha,
    devoluciones:reg.devoluciones||[],
    estadoEntrega:reg.estadoEntrega||reg.entregados||{},
    motivosDevTotal:reg.motivosDevTotal||{},
    descuentos:reg.descuentos||{}, comentarios:reg.comentarios||{},
    deposito:reg.deposito||"", transferencia:reg.transferencia||"",
    gastosDetalle:reg.gastosDetalle||[{desc:"",monto:"",comentario:""}],
    billetes:reg.billetes||Object.fromEntries(BILLETES.map(b=>[b,""])),
    monedas:reg.monedas||"",
    pagoPendiente:reg.pagoPendiente||{},
    bloqueados:Object.fromEntries(Object.keys(reg.estadoEntrega||{}).map(k=>[k,true])),
    busqueda:"", clienteDetalle:null, confirmado:true, modoHistorial:true,
    // historialRepSelec se mantiene para poder volver correctamente al nivel de fechas
  });
}

function abrirModalCambiarFecha(fechaVieja) {
  const prev = document.getElementById("modal-cambiar-fecha");
  if(prev) prev.remove();

  const overlay = document.createElement("div");
  overlay.id = "modal-cambiar-fecha";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;font-family:sans-serif;";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:14px;padding:28px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.2);";

  const titulo = document.createElement("h3");
  titulo.textContent = "📅 Cambiar fecha de liquidación";
  titulo.style.cssText = "margin:0 0 6px;color:#1e3a5f;font-size:16px;";
  box.appendChild(titulo);

  const subtitulo = document.createElement("p");
  subtitulo.style.cssText = "font-size:12px;color:#888;margin:0 0 18px;";
  subtitulo.textContent = `Fecha actual: ${fechaVieja}`;
  box.appendChild(subtitulo);

  const lbl = document.createElement("label");
  lbl.textContent = "Nueva fecha";
  lbl.style.cssText = "display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px;text-transform:uppercase;";
  box.appendChild(lbl);

  const fechaInp = document.createElement("input");
  fechaInp.type = "date";
  fechaInp.value = fechaVieja;
  fechaInp.style.cssText = "width:100%;padding:10px 12px;border-radius:8px;border:2px solid #1e3a5f;font-size:15px;box-sizing:border-box;font-family:sans-serif;margin-bottom:16px;";
  box.appendChild(fechaInp);

  const errP = document.createElement("p");
  errP.style.cssText = "color:#c00;font-size:12px;margin:0 0 12px;min-height:16px;display:none;";
  box.appendChild(errP);

  const btnRow = document.createElement("div");
  btnRow.style.cssText = "display:flex;gap:10px;";

  const btnGuardar = document.createElement("button");
  btnGuardar.textContent = "💾 Guardar cambio";
  btnGuardar.style.cssText = "flex:1;background:#1e3a5f;color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
  btnGuardar.onclick = async () => {
    const fechaNueva = fechaInp.value.trim();
    if(!fechaNueva) { errP.textContent="Selecciona una fecha."; errP.style.display="block"; return; }
    if(fechaNueva === fechaVieja) { errP.textContent="La fecha nueva es igual a la actual."; errP.style.display="block"; return; }

    const historial = await fbGet("historial") || {};

    if(historial[fechaNueva]) {
      // Ya existe una liquidación en esa fecha → pedir confirmación
      const confirmar = await new Promise(resolve => {
        showModal({
          titulo: "⚠️ Ya existe una liquidación",
          mensaje: `Ya hay una liquidación registrada el ${fechaNueva}. ¿Deseas reemplazarla con la del ${fechaVieja}?`,
          tipo: "confirm",
          btnAceptar: "Sí, reemplazar",
          colorAceptar: "#c0392b",
          btnCancelar: "Cancelar",
          onAceptar: () => resolve(true),
          onCancelar: () => resolve(false)
        });
      });
      if(!confirmar) return;
    }

    btnGuardar.disabled = true;
    btnGuardar.textContent = "Guardando...";
    try {
      const registro = historial[fechaVieja];
      // Mover: copiar con nueva fecha y borrar clave vieja
      const registroActualizado = { ...registro, fecha: fechaNueva };
      historial[fechaNueva] = registroActualizado;
      delete historial[fechaVieja];
      await fbSet("historial", historial);

      // Actualizar state local
      const nuevoData = { ...state.historialData };
      nuevoData[fechaNueva] = registroActualizado;
      delete nuevoData[fechaVieja];
      setState({ historialData: nuevoData });

      overlay.remove();
      showToast("✅ Fecha actualizada a " + fechaNueva, "#27ae60");
    } catch(e) {
      errP.textContent = "Error al guardar. Intenta de nuevo.";
      errP.style.display = "block";
      btnGuardar.disabled = false;
      btnGuardar.textContent = "💾 Guardar cambio";
    }
  };
  btnRow.appendChild(btnGuardar);

  const btnCancelar = document.createElement("button");
  btnCancelar.textContent = "Cancelar";
  btnCancelar.style.cssText = "flex:1;background:#eee;color:#555;border:none;border-radius:8px;padding:12px 0;font-size:14px;cursor:pointer;font-family:sans-serif;";
  btnCancelar.onclick = () => overlay.remove();
  btnRow.appendChild(btnCancelar);
  box.appendChild(btnRow);

  overlay.appendChild(box);
  overlay.addEventListener("click", e => { if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  setTimeout(() => fechaInp.focus(), 100);
}

        btnFinal.textContent="✅ Confirmar";
        btnFinal.onclick = () => {
          if(!motSel.value){ showModal({titulo:'⚠️ Campo requerido', mensaje:'Selecciona un motivo de devolución.', tipo:'alert', btnAceptar:'Entendido'}); return; }
          const motivo = MOTIVOS.find(x=>x.codigo===motSel.value)||{};
          const newDevs = state.devoluciones.map(d=>d.cliente===c?{...d,codigo:motivo.codigo,desc:motivo.desc}:d);
          setState({devoluciones:newDevs, dvCodigo:"D01", showDvForm:false, _dvTipo:undefined});
          confirmarDesdeDetalle(c, dvTipo, motivo.codigo, motivo.desc);
        };
        confirmBox.appendChild(btnFinal);
        confirmBox.appendChild(el("button",{style:{width:"100%",background:"#eee",color:"#555",border:"none",borderRadius:"8px",padding:"10px 0",fontSize:"13px",cursor:"pointer",fontFamily:"sans-serif"},onClick:()=>setState({showDvForm:false})},"Cancelar"));
      } else {
        // Botón único de confirmar
        const btnConfirmar = document.createElement("button");
        btnConfirmar.style.cssText="width:100%;background:#27ae60;color:#fff;border:none;border-radius:8px;padding:14px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;";
        btnConfirmar.textContent="✅ Confirmar entrega";
        btnConfirmar.onclick = () => {
          if(tieneDevsParciales){
            // Verificar si todas las unidades entregables fueron devueltas → rosado
            const totalUnidadesEntregables = pedidosEntregables.reduce((s,[,p])=>s+p.lineas.filter(l=>!/^pre$/i.test(l.estPed||"")).reduce((ss,l)=>ss+l.unidades,0),0);
            const totalDevUnidades = devsCl.reduce((s,d)=>s+d.unidades,0);
            const esDevTotal = totalDevUnidades >= totalUnidadesEntregables;
            if(esDevTotal){
              setState({showDvForm:true, _dvTipo:"rosado"});
            } else {
              setState({showDvForm:true, _dvTipo:"amarillo"});
            }
          } else {
            confirmarDesdeDetalle(c,"verde");
          }
        };
        confirmBox.appendChild(btnConfirmar);
      }

      inner.appendChild(confirmBox);
    }
  } else if(estado && (state.modoHistorial || esPresupuesto)) {
    const estadoLabel = estado==="verde"?"✅ Entrega efectiva":estado==="amarillo"?"🟡 Entrega parcial":"↩️ Devolución total";
    const estadoBg = estado==="verde"?"#e8f5e9":estado==="amarillo"?"#fffde7":"#fce4ec";
    const estadoColor = estado==="verde"?"#27ae60":estado==="amarillo"?"#f9a825":"#e91e8c";
    inner.appendChild(el("div",{style:{background:estadoBg,borderRadius:"12px",padding:"14px 18px",marginBottom:"16px",display:"flex",justifyContent:"space-between",alignItems:"center"}},

      el("span",{style:{fontSize:"12px",color:"#888"}},"📋 Solo lectura")
    ));
  }

  return wrap;
}

      .map(l => l.producto?.toLowerCase()||"");
    return productos.some(p => p.includes(busquedaLower));
  });
  const totalBilletes=BILLETES.reduce((s,b)=>s+b*(parseFloat(state.billetes[b])||0),0);
  const totalMonedas=parseFloat(state.monedas)||0;
  const totalEfectivo=totalBilletes+totalMonedas;
  const totalDeposito=parseFloat(state.deposito)||0;
  const totalTransferencia=parseFloat(state.transferencia)||0;
  const totalGastosDeCuenta=state.gastosDetalle.reduce((s,g)=>g.deCuenta?(s+(parseFloat(g.monto)||0)):s,0);
  const totalGastos=state.gastosDetalle.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const totalPagos=totalEfectivo+totalDeposito+totalTransferencia;
  // Total a cobrar solo de confirmados
  const totalACobrarConfirmado = Object.keys(state.clienteMap)
    .filter(c=>state.estadoEntrega[c] && state.estadoEntrega[c]!=="rosado")
    .reduce((s,c)=>s+totalesCliente(c).netoM,0);
  const diferencia=(totalPagos+totalGastosDeCuenta)-totalACobrarConfirmado;
  const porRuta={};

function renderListaRutas(container, porRuta) {

      return s+totalesCliente(c).devM;
    },0);
    const pctEfectividadR=rutaEntregables.length>0?Math.round((cntVerdeR+cntAmarilloR)/rutaEntregables.length*100):0;

    rutaHdr.appendChild(rutaInfo); rutaDiv.appendChild(rutaHdr);

  inner.appendChild(hdr);

  const cuadrePanel = _buildCuadrePanel(state.modoHistorial, ()=>{
    const sinConfirmar=clientes.filter(c=>!state.estadoEntrega[c] && !esClientePre(c));

      return;
    }
    const _tBill2=BILLETES.reduce((s,b)=>s+b*(parseFloat(state.billetes[b])||0),0);
    const _tMon2=parseFloat(state.monedas)||0;
    const _tDep2=parseFloat(state.deposito)||0;
    const _tTra2=parseFloat(state.transferencia)||0;
    if(_tBill2+_tMon2+_tDep2+_tTra2<=0){
      showModal({titulo:"⚠️ Sin pagos registrados", mensaje:"El total recibido es Q 0.00.\n\nDebes ingresar al menos un monto en efectivo, depósito o transferencia antes de confirmar.", tipo:"alert", btnAceptar:"Entendido"});
      return;
    }
    setState({showConfirmar:true});
  });
  inner.appendChild(cuadrePanel);

  // Modal confirmar (igual que en renderMain)
  if(state.showConfirmar){
    const totalBilletesM = BILLETES.reduce((s,b)=>s+b*(parseFloat(state.billetes[b])||0),0);
    const totalMonedasM = parseFloat(state.monedas)||0;
    const totalEfectivoM = totalBilletesM+totalMonedasM;
    const totalDepositoM = parseFloat(state.deposito)||0;
    const totalTransferenciaM = parseFloat(state.transferencia)||0;
    const totalGastosM = state.gastosDetalle.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
    const totalGastosDeCuentaM = state.gastosDetalle.reduce((s,g)=>g.deCuenta?(s+(parseFloat(g.monto)||0)):s,0);
    const totalPagosM = totalEfectivoM+totalDepositoM+totalTransferenciaM;
    const totalAEntregarM = clientesEntregables.reduce((s,c)=>{let m=0;Object.values(state.clienteMap[c].pedidos||{}).filter(p=>!esPedPre(p)).forEach(p=>p.lineas.forEach(l=>{m+=l.monto;}));return s+m;},0);
    const totalDescM = clientesEntregables.reduce((acc,c)=>{
      if(!state.estadoEntrega[c]||state.estadoEntrega[c]==="rosado") return acc;
      return acc+(parseFloat(state.descuentos[c])||0);
    },0);
    const totalDevM = clientesEntregables.reduce((s,c)=>{
      if(state.estadoEntrega[c]==="rosado") return s+totalesCliente(c).monto;
      return s+totalesCliente(c).devM;
    },0);
    const totalNetoM = totalAEntregarM - totalDevM - totalDescM;
    const diferenciaM = (totalPagosM+totalGastosDeCuentaM)-totalNetoM;
    const difColor = Math.abs(diferenciaM)<0.01?"#27ae60":diferenciaM>0?"#2563eb":"#c0392b";
    const difTexto = Math.abs(diferenciaM)<0.01?"✓ CUADRADO":diferenciaM>0?`+${fQ(diferenciaM)} SOBRANTE`:`-${fQ(Math.abs(diferenciaM))} FALTANTE`;
    const modal=el("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:"999",overflowY:"auto",padding:"20px 0"}});
